schema_version = "0.3"
name = "umami"
version = "2.17.0"
type = "app"
description = "Privacy-focused analytics — simple, fast, open-source"
homepage = "https://github.com/umami-software/umami"

default_target = "app"

[targets.db]
runtime = "oci"
image = "postgres:16-alpine"
port = 5432
env = { POSTGRES_DB = "umami", POSTGRES_USER = "umami", POSTGRES_PASSWORD = "umami-secret" }

[targets.app]
runtime = "oci"
image = "ghcr.io/umami-software/umami:postgresql-v2.17.0"
port = 3000
env = { DATABASE_URL = "postgresql://umami:umami-secret@localhost:5432/umami", APP_SECRET = "changeme-demo-secret" }
depends_on = ["db"]

[state.db-data]
kind = "filesystem"
durability = "persistent"
purpose = "PostgreSQL data for Umami analytics"
attach = "explicit"
schema_id = "sha256:umami-pgdata-v1"

[services.main]
target = "app"
readiness_probe = { http_get = "/api/heartbeat", port = "3000", timeout_seconds = 120 }

[[services.main.state_bindings]]
state = "db-data"
target = "/var/lib/postgresql/data"
service_target = "db"
