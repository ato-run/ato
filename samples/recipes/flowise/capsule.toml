schema_version = "0.3"
name = "flowise"
version = "2.2.7"
type = "app"
description = "Drag-and-drop AI workflow builder — LangChain, LlamaIndex, agents"
homepage = "https://github.com/FlowiseAI/Flowise"

default_target = "app"

[targets.app]
runtime = "oci"
image = "flowiseai/flowise:2.2.7"
port = 3000

[state.data]
kind = "filesystem"
durability = "persistent"
purpose = "flows, credentials, uploads"
attach = "explicit"
schema_id = "sha256:flowise-data-v1"

[services.main]
target = "app"
readiness_probe = { http_get = "/", port = "3000", timeout_seconds = 120 }

[[services.main.state_bindings]]
state = "data"
target = "/root/.flowise"
