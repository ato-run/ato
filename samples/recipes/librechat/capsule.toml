schema_version = "0.3"
name = "librechat"
version = "0.7.8"
type = "app"
description = "Self-hosted AI chat UI supporting multiple providers and models"
homepage = "https://github.com/danny-avila/LibreChat"

default_target = "app"

[targets.db]
runtime = "oci"
image = "mongo:7"
port = 27017

[targets.app]
runtime = "oci"
image = "ghcr.io/danny-avila/librechat:v0.7.8"
port = 3080
# Multi-container: the app reaches MongoDB via the `db` target's DNS name, not localhost.
env = { MONGO_URI = "mongodb://db:27017/LibreChat", JWT_SECRET = "changeme-demo-secret", JWT_REFRESH_SECRET = "changeme-refresh-secret", CREDS_KEY = "changeme-creds-key-32chars-padded", CREDS_IV = "changeme-creds-iv" }
depends_on = ["db"]

[state.db-data]
kind = "filesystem"
durability = "persistent"
purpose = "MongoDB data"
attach = "explicit"
schema_id = "sha256:librechat-mongodb-v1"

# MongoDB must run as its own service for the db-data binding below to mount and
# for the app (depends_on = ["db"]) to connect. Without this the volume is never
# attached and MongoDB never starts.
[services.db]
target = "db"

[services.main]
target = "app"
readiness_probe = { http_get = "/", port = "3080", timeout_seconds = 120 }

[[services.main.state_bindings]]
state = "db-data"
target = "/data/db"
service_target = "db"
