schema_version = "0.3"
name = "pocketbase"
version = "1.0.0"
type = "app"
description = "Open-source backend with built-in DB, auth, and admin UI in a single binary"
homepage = "https://github.com/pocketbase/pocketbase"

default_target = "app"

[source]
repository = "pocketbase/pocketbase"

[targets.app]
runtime = "oci"
# Pin note: proposed pin to ghcr.io/muchobien/pocketbase:0.26.0 — not yet AODD-confirmed
# AODD digest (2026-05-23): sha256:2d41181ceeca...
image = "ghcr.io/muchobien/pocketbase:latest"
port = 8090
env = {}

[state.data]
kind = "filesystem"
durability = "persistent"
purpose = "PocketBase data directory (database, logs, backups)"
attach = "explicit"
schema_id = "sha256:7cf927e0fe440c6d559fee2a176e567bc710d62eab6a4c275b955f1581fd02c9"

[services.main]
target = "app"
readiness_probe = { http_get = "/_/", port = "8090" }

[[services.main.state_bindings]]
state = "data"
target = "/pb_data"
