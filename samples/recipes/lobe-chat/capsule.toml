schema_version = "0.3"
name = "lobe-chat"
version = "1.143.3"
type = "app"
description = "Self-hosted AI chat UI — supports multiple LLM providers (OpenAI, Anthropic, Ollama, etc.)"
homepage = "https://github.com/lobehub/lobe-chat"

default_target = "app"

[targets.app]
runtime = "oci"
# Lite / standalone mode: no external database required.
# To enable multi-user auth, add DATABASE_URL and NEXT_AUTH_SECRET env vars.
image = "lobehub/lobe-chat:1.143.3"
port = 3210

[services.main]
target = "app"
readiness_probe = { http_get = "/", port = "3210" }
