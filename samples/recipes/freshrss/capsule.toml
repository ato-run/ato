schema_version = "0.3"
name = "fresh-rss"
version = "1.30.0"
type = "app"
description = "A free, self-hostable RSS aggregator"
homepage = "https://github.com/FreshRSS/FreshRSS"

default_target = "app"

[source]
repository = "FreshRSS/FreshRSS"

[targets.app]
runtime = "oci"
image = "freshrss/freshrss:1.30.0"
port = 80
env = { CRON_MIN = "7" }

[state.data]
kind = "filesystem"
durability = "persistent"
purpose = "RSS feed data and configuration"
attach = "explicit"
schema_id = "sha256:33026e1fa02a5197975ab0908af0d8f2aa3695c73c4bb06f8d0aad9c2a1b1acf"

[services.main]
target = "app"
readiness_probe = { http_get = "/", port = "80", initial_delay_seconds = 10, timeout_seconds = 60 }

[[services.main.state_bindings]]
state = "data"
target = "/var/www/FreshRSS/data"
