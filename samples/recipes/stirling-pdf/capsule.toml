schema_version = "0.3"
name = "stirling-pdf"
version = "2.11.0"
type = "app"
description = "Self-hosted PDF tools — merge, split, compress, convert, and annotate PDFs in the browser"
homepage = "https://github.com/Stirling-Tools/Stirling-PDF"

default_target = "app"

[targets.app]
runtime = "oci"
# Fully-qualified docker.io ref: ato's OCI digest resolver fails on a bare Docker Hub
# short-ref ("frooodle/s-pdf:2.11.0" -> E999 "failed to resolve image"); the explicit
# registry form resolves (verified on a Linux Connected Runner — see ato-demo-apps).
image = "docker.io/frooodle/s-pdf:2.11.0"
port = 8080
# Stirling PDF v2.x enables an account/login wall by default (GET / -> 401, default
# admin/stirling user + MFA prompts). Disable the login system for a frictionless
# single-user demo so the browser opens straight into the PDF tools. Do NOT use this
# for any shared/multi-user deployment.
env = { SECURITY_ENABLELOGIN = "false", DISABLE_ADDITIONAL_FEATURES = "true" }

[services.main]
target = "app"
# With login disabled, GET / returns 200 (the app shell) — probe it directly.
readiness_probe = { http_get = "/", port = "8080" }
