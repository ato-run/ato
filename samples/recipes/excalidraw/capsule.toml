schema_version = "0.3"
name = "excalidraw"
# Recipe revision marker (semver required by manifest validator). The image
# itself is digest-pinned below because excalidraw/excalidraw does not publish
# semver-tagged images on Docker Hub. Bumped from "0.17.6" — the version PR
# #254 documented as unpullable — to indicate the recipe content changed.
# 0.18.1: re-pin from the arm64 child digest to the multi-arch index digest so
# OCI launch works on amd64 hosts (was `Exec format error`).
version = "0.18.1"
type = "app"
description = "Virtual collaborative whiteboard for sketching hand-drawn diagrams"
homepage = "https://github.com/excalidraw/excalidraw"

default_target = "app"

[source]
repository = "excalidraw/excalidraw"

[targets.app]
runtime = "oci"
# `excalidraw/excalidraw` does not publish semver-tagged images on Docker Hub —
# only `latest` and dev-build `sha-*` tags from 2021. PR #254 documented the
# original `:0.17.6` pin as unpullable (Docker Hub returned `manifest unknown`).
# Pin by digest to keep the demo reproducible while upstream only offers a
# floating `latest`.
#
# MUST be the multi-arch *index* (manifest-list) digest, NOT a single-arch
# child. The previous pin (`sha256:0faa2324…`) was the linux/arm64 child digest,
# so on amd64 hosts Podman pulled the arm64 image and the container died with
# `exec /docker-entrypoint.sh: Exec format error`. The index digest lets the
# runtime auto-select the host architecture (amd64/arm64). Digest below is the
# `:latest` index as of 2026-06-03; refresh together with version bumps. Verify
# with `docker buildx imagetools inspect excalidraw/excalidraw:latest` — the
# MediaType must be `application/vnd.oci.image.index.v1+json`.
image = "excalidraw/excalidraw@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9"
# The upstream image runs nginx on port 80 (privileged on host). Rewrite the
# listen directive in /etc/nginx/conf.d/default.conf before launching so the
# main service can publish at an unprivileged host port. Keeps us on the
# upstream image (no third-party fork) per the task brief.
cmd = ["sh", "-c", "sed -i 's/listen[[:space:]]*80;/listen 8080;/' /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
port = 8080

[services.main]
target = "app"
readiness_probe = { http_get = "/", port = "8080" }
