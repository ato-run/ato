schema_version = "0.3"
name = "native-llama"
version = "0.1.0"
type = "app"
description = "Host-native llama.cpp inference server (Dockerless). A managed llama.cpp engine is auto-fetched by build tag; only a local GGUF model is required."
homepage = "https://github.com/ato-run/ato"

default_target = "llama"

[targets.llama]
runtime = "native-inference"
# Managed engine: Ato fetches the pinned llama.cpp release (the `engine_version`
# build tag) into its toolchain cache and runs `llama-server` as a host process.
engine = "llama.cpp"
engine_version = "b9754"
# To use a local engine binary instead, drop `engine_version` and set:
#   engine_path = "./llama-server"   # overrides managed fetching
# Local path to a GGUF model file (relative to this dir, or absolute).
model = "./model.gguf"
model_format = "gguf"
# llama-server listens here; Ato injects `--port <N>` (allocated) and waits for
# readiness on it, then reports the app_url.
port = 8080
