# SolidCraft 0.43.0 (upstream: Tangency Labs, https://github.com/tangency-labs/solidcraft)
# two realizations of ONE Contract: a pre-built CLI fetched from the upstream
# release, and the same CLI built from the pinned source commit.
#
# Ato is the porter, not the distributor: D1 names the upstream asset by URL,
# size and SHA-256 and carries no artifact blob, so nothing branded is
# redistributed in the bundle. The upstream LICENSE-BRAND keeps the name,
# logo and icons with Tangency Labs; this sample shows no brand asset and the
# Application title is the textual attribution only.
#
# Contract K. What a Run can check about this application is limited by what
# the application exposes. The upstream CLI is a one-shot command-line program:
# it opens no listening socket in any mode (see README, "Why this Contract is
# only a surface declaration"), so there is no measured response body to pin.
# K therefore states only the surface the route must own - its declared
# app.http Port answering GET / with 200 - and pins no body_digest, because a
# digest that was never observed would be a claim, not evidence. The values
# this sample does measure (the deterministic script transcript, its digest and
# exit status) are recorded in README and expected/box-measure.results.json for
# the terminal-exchange verifier that K will use once it exists.
schema = "ato.capsule/2"

[application]
title = "SolidCraft v0.43.0 - Tangency Labs, Ato port"
surface_path = "/"

[[input]]
id = "workspace"
use = "ato.workspace@1"
path = "."

[contract]
mode = "all"

# The route's declared surface answers. No body_digest: see the note above.
[[contract.observation]]
id = "surface-root"
use = "ato.contract.http@1"
port = "app.http"
method = "GET"
path = "/"
status = 200

# D1 - pre-built: the upstream v0.43.0 macOS universal CLI archive, referenced
# by digest and fetched by the host. 153,719,917 bytes,
# sha256:0633d662f3b410da90616d6c7e412f6d799693164541abea82c8d53802ad1d0a.
[[derivation]]
id = "prebuilt"
use = "ato.native@1"
guest_port = 18080
runtimes = { "ato.native.remote_url" = "https://github.com/tangency-labs/solidcraft/releases/download/v0.43.0/solidcraft-cli-0.43.0-macos-universal.zip", "ato.native.remote_sha256" = "sha256:0633d662f3b410da90616d6c7e412f6d799693164541abea82c8d53802ad1d0a", "ato.native.remote_bytes" = "153719917" }
format = "zip"
os = "macos"
arch = "aarch64"
entry = "solidcraft-cli-0.43.0-macos-universal/solidcraft-cli"

# D2 - from source: commit 8ba46e9e2181396a9b5903b98031399aef61cf26 as GitHub's
# commit tarball (217,936,976 bytes,
# sha256:1d0e68cd22e86e225123fa55825e8b91f5efcac379d98e38669ee709353cb8e3),
# built with the workspace's oldest supported Rust (Cargo.toml rust-version
# 1.95) into the content-addressed build tree the Adapter materializes.
[[derivation]]
id = "from-source"
use = "ato.native@1"
guest_port = 18080
runtimes = { "ato.native.source_url" = "https://codeload.github.com/tangency-labs/solidcraft/tar.gz/8ba46e9e2181396a9b5903b98031399aef61cf26", "ato.native.source_commit" = "8ba46e9e2181396a9b5903b98031399aef61cf26", "ato.native.source_sha256" = "sha256:1d0e68cd22e86e225123fa55825e8b91f5efcac379d98e38669ee709353cb8e3", "ato.native.cargo_lock" = "sha256:b35566c1e58ca752da5669fdcca6951df3c2e0b514d4019a7b02426414804743", "ato.native.toolchain" = "rust:1.95.0", "ato.native.build_argv" = "cargo build --locked --release -p solidcraft-cli", "ato.native.build_cache" = "content-hash" }
os = "macos"
arch = "aarch64"
entry = ".ato-build/target/release/solidcraft-cli"

[effects]
default = "pure"
