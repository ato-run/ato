# SolidCraft 0.43.0 (upstream: Tangency Labs, https://github.com/tangency-labs/solidcraft)
# Two realizations of ONE Contract: the pre-built CLI fetched from the upstream
# release, and the same CLI built from the pinned source commit.
#
# Ato is the porter, not the distributor: D1 names the upstream asset by URL,
# size and SHA-256 and carries no artifact blob, so nothing branded is
# redistributed in the bundle. The upstream LICENSE-BRAND keeps the name, logo
# and icons with Tangency Labs; this sample shows no brand asset and the
# Application title is the textual attribution only.
#
# Contract K. The CLI opens no listening socket, so K is not an HTTP response:
# it is the CLI answering one declared MCP request over the PTY the Adapter
# owns. Each Route is launched with "mcp --headless" and must answer the
# JSON-RPC initialize line and frame the reply with "serverInfo" (a delimiter the
# echoed input cannot produce, so the exchange cannot satisfy itself). No
# body_digest is pinned: the
# CLI's startup notice embeds a run-local temporary path, so the bytes differ
# per Run while the exchange (the framed reply line) is the same. A digest that
# was never observed would be a claim, not evidence.
schema = "ato.capsule/2"

[application]
title = "SolidCraft v0.43.0 - Tangency Labs, Ato port"
surface_path = "/"

[[input]]
id = "workspace"
use = "ato.workspace@1"
path = "."

[contract]
mode = "all"

[[contract.observation]]
id = "cli-initialize"
use = "ato.contract.terminal@1"
port = "app.terminal"
path = "/initialize"

# D1 - pre-built: the upstream v0.43.0 macOS universal CLI archive, referenced
# by digest and fetched by the host. 153,719,917 bytes,
# sha256:0633d662f3b410da90616d6c7e412f6d799693164541abea82c8d53802ad1d0a.
[[derivation]]
id = "prebuilt"
use = "ato.native@1"
runtimes = { "ato.native.remote_url" = "https://github.com/tangency-labs/solidcraft/releases/download/v0.43.0/solidcraft-cli-0.43.0-macos-universal.zip", "ato.native.remote_sha256" = "sha256:0633d662f3b410da90616d6c7e412f6d799693164541abea82c8d53802ad1d0a", "ato.native.remote_bytes" = "153719917", "ato.native.format" = "zip", "ato.native.argv" = '["mcp","--headless"]' }
format = "zip"
os = "macos"
arch = "aarch64"
entry = "solidcraft-cli-0.43.0-macos-universal/solidcraft-cli"

[derivation.native_surface]
kind = "terminal"
port = "app.terminal"
cols = 120
rows = 40

[[derivation.native_surface.operations]]
kind = "terminal_exchange"
path = "/initialize"
input = [123,34,106,115,111,110,114,112,99,34,58,34,50,46,48,34,44,34,105,100,34,58,49,44,34,109,101,116,104,111,100,34,58,34,105,110,105,116,105,97,108,105,122,101,34,44,34,112,97,114,97,109,115,34,58,123,125,125,10]
output_delimiter = [115,101,114,118,101,114,73,110,102,111]
max_output_bytes = 65536
timeout_ms = 20000

# D2 - from source: commit 8ba46e9e2181396a9b5903b98031399aef61cf26 as GitHub's
# commit tarball (217,936,976 bytes,
# sha256:1d0e68cd22e86e225123fa55825e8b91f5efcac379d98e38669ee709353cb8e3),
# built with the workspace's oldest supported Rust (Cargo.toml rust-version
# 1.95) into the content-addressed build tree the Adapter materializes.
[[derivation]]
id = "from-source"
use = "ato.native@1"
runtimes = { "ato.native.source_url" = "https://codeload.github.com/tangency-labs/solidcraft/tar.gz/8ba46e9e2181396a9b5903b98031399aef61cf26", "ato.native.source_commit" = "8ba46e9e2181396a9b5903b98031399aef61cf26", "ato.native.source_sha256" = "sha256:1d0e68cd22e86e225123fa55825e8b91f5efcac379d98e38669ee709353cb8e3", "ato.native.cargo_lock" = "sha256:b35566c1e58ca752da5669fdcca6951df3c2e0b514d4019a7b02426414804743", "ato.native.toolchain" = "rust:1.95.0", "ato.native.build_argv" = "cargo build --locked --release -p solidcraft-cli", "ato.native.build_cache" = "content-hash", "ato.native.argv" = '["mcp","--headless"]' }
os = "macos"
arch = "aarch64"
entry = ".ato-build/target/release/solidcraft-cli"
# A local build has no upstream Developer ID signature. The caller must also
# pass --allow-unsigned-native; this declaration alone does not authorize it.
signature = "require-valid-or-local-override"

[derivation.native_surface]
kind = "terminal"
port = "app.terminal"
cols = 120
rows = 40

[[derivation.native_surface.operations]]
kind = "terminal_exchange"
path = "/initialize"
input = [123,34,106,115,111,110,114,112,99,34,58,34,50,46,48,34,44,34,105,100,34,58,49,44,34,109,101,116,104,111,100,34,58,34,105,110,105,116,105,97,108,105,122,101,34,44,34,112,97,114,97,109,115,34,58,123,125,125,10]
output_delimiter = [115,101,114,118,101,114,73,110,102,111]
max_output_bytes = 65536
timeout_ms = 20000

[effects]
default = "pure"
