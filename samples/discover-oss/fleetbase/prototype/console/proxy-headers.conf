# The origin comes from the same validated Binding as the API supervisor.
# Discard client-provided forwarding metadata at this physical boundary.
proxy_set_header Host "${ATO_AUTHORITY}";
proxy_set_header X-Forwarded-Host "${ATO_AUTHORITY}";
proxy_set_header X-Forwarded-Port "${ATO_PORT}";
proxy_set_header X-Forwarded-Proto "${ATO_SCHEME}";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Forwarded-Scheme "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Original-Host "";
proxy_set_header X-Original-URL "";
proxy_set_header X-Rewrite-URL "";
proxy_set_header Forwarded "";
