schema = "ato.capsule/2"

[application]
title = "Messenger"
surface_path = "/"

[[input]]
id = "workspace"
use = "ato.workspace@1"
path = "."

[[state]]
id = "data"
use = "ato.state.filesystem@1"
mount = "/var/lib/databag"
access = "read-write"

[contract]
mode = "all"

[[contract.observation]]
id = "app-ready"
use = "ato.contract.http@1"
port = "app.http"
method = "GET"
path = "/"
status = 200
body_digest = "sha256:6689cbee895548c5f47e38ff0ec5ecf3729246138bd3438df1c0ad08099a474f"

[[derivation]]
id = "oci-linux-amd64"
use = "ato.oci@1"
argv = ["run"]
cwd = "."
guest_port = 7000
runtimes = { "oci.image" = "docker.io/balzack/databag@sha256:0657cf266b16d3ec725ca41adb2b91db25c7d0a6cdd476aba21a4e850cdfa56f", "oci.platform" = "linux/amd64", "oci.entrypoint" = "/app/entrypoint.sh", "oci.workspace_mount" = "/ato/workspace", "oci.memory_bytes" = "536870912", "oci.cpu_limit_millis" = "1000", "oci.pids_limit" = "256" }

[effects]
default = "pure"
