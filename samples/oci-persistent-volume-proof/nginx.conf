# Runs read-only as nginx-unprivileged: every writable path lives on /tmp.
# This service has no state mount; only the backend sees /data.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }
    # `backend` is the sibling service's network alias; its Port is internal.
    location /api/ {
      proxy_pass http://backend:8081;
    }
    location = / {
      default_type text/html;
      return 200 "<!doctype html><title>Persistent volume proof</title><p>GET /api/value, PUT /api/value, GET /api/mounts</p>\n";
    }
  }
}
