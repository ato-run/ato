schema = "ato.capsule/1"

[[input]]
id = "workspace"
use = "ato.workspace@1"
path = "."

[[derive.step]]
id = "site"
use = "ato.browser@1"
op = "serve"
source = "workspace"
entry = "index.html"
spa_fallback = false

[[port]]
id = "app.http"
use = "ato.http@1"
from = "site"

[[contract.require]]
id = "proof"
use = "ato.contract.http@1"
port = "app.http"
method = "GET"
path = "/proof.txt"

[contract.require.expect]
status = 200
body_digest = "sha256:3dff2a71ccf21888ce6a043e4e67eea3c1b1c31b62d16050cd82e1d40610b0dd"

[[contract.require]]
id = "source-identity"
use = "ato.contract.workspace@1"
input = "workspace"

[contract.require.expect]
digest = "capture"
