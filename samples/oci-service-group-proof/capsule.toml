schema = "ato.capsule/2"

[application]
title = "OCI service group proof"
surface_path = "/"

[[input]]
id = "workspace"
use = "ato.workspace@1"
path = "."

[[state]]
id = "data"
use = "ato.state.filesystem@1"
mount = "/data"
access = "read-write"

[contract]
mode = "all"

[[contract.observation]]
id = "surface-ready"
use = "ato.contract.http@1"
port = "app.http"
path = "/healthz"
status = 200
body_digest = "sha256:dc51b8c96c2d745df3bd5590d990230a482fd247123599548e0632fdbf97fc22"

# Served by the internal backend through the Surface service's proxy.
[[contract.observation]]
id = "backend-through-surface"
use = "ato.contract.http@1"
port = "app.http"
path = "/"
status = 200

[[derivation]]
id = "oci-service-group"
use = "ato.oci@1"
runtimes = { "oci.platform" = "linux/amd64" }

[[derivation.service]]
id = "backend"
runtimes = { "oci.image" = "docker.io/traefik/whoami@sha256:4f90b33ddca9c4d4f06527070d6e503b16d71016edea036842be2a84e60c91cb", "oci.memory_bytes" = "134217728", "oci.cpu_limit_millis" = "500", "oci.pids_limit" = "64" }
argv = ["--port", "8081"]
ports = [{ id = "backend.http", guest_port = 8081 }]
state = ["data"]

[[derivation.service]]
id = "web"
runtimes = { "oci.image" = "docker.io/nginxinc/nginx-unprivileged@sha256:28d91bdce70ad09025ea901458fdd149259d8e05982ade79d4ef2c0d9470eb48", "oci.memory_bytes" = "134217728", "oci.cpu_limit_millis" = "500", "oci.pids_limit" = "64", "oci.entrypoint" = "/usr/sbin/nginx" }
argv = ["-c", "/app/nginx.conf", "-g", "daemon off;"]
ports = [{ id = "app.http", guest_port = 8080 }]

[effects]
default = "pure"
