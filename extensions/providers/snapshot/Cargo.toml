[package]
name = "ato-provider-snapshot"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
homepage = "https://ato.run"
repository = "https://github.com/ato-run/ato"
description = "Snapshot materialization provider for Ato computations"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "provider"

[lib]
name = "snapshot"
path = "src/lib.rs"

# Dev/KVM-host latency benchmark tool (not part of the product CLI).
[[bin]]
name = "ready-state-bench"
path = "src/bin/ready_state_bench.rs"

[features]
# Exposes the `#[cfg(test)]` eligibility test constructors
# (`VerifiedRunningSnapshotEligibility::{for_test, analyze_for_test}`) to sibling
# crates' test harnesses (PR-2: the `snapshot-builder` HoldPhase unit tests).
# Non-default and dev-dependency-only, so a normal build/library consumer never
# gains a non-production eligibility constructor.
test-support = []

[dependencies]
anyhow = "1.0"
# Build-time screenshot capture (store thumbnail automation): base64-encodes
# the captured PNG for the snapshot-builder ack body. Already a workspace
# dependency (capsule/cli/desktop/nacelle/netd) — reused here, same version.
base64 = "0.22"
blake3 = "1.5"
capsule = { path = "../../../crates/capsule" }
# Hex encoding for the source-receipt digest label. Already a transitive dep via
# capsule; declared directly because this crate now formats digests itself.
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
fastcdc = "3.2"
# BindingName: the rootfs_builder validates each secret's derived binding name against
# the SAME canonical rule the guest-agent enforces, so an unbootable supervisor.json
# (uppercase binding name → agent exit(2) before vsock listener) is rejected at emission.
ato-ipc = { path = "../../../lib/ipc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
serde_yaml = "0.9"
# Docker import provenance (ato#994): dockerfile/context hashing is sha256 to match
# the registry digest algebra the rest of the receipt speaks (image digests are
# sha256:…); blake3 stays the CAS-internal hash.
sha2 = "0.10"
thiserror = "2.0"
# U1 (#854): the UFFD page-server uses raw userfaultfd ioctls + SCM_RIGHTS recvmsg
# (Linux-only; the module body is cfg(target_os="linux")-gated).
libc = "0.2"
# Scratch directory for the source-archive round-trip check: the archive is
# extracted back and re-digested before anything is stored. Already a
# dev-dependency; promoted because this now runs in a shipped path.
tempfile = "3"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"
