[package]
name = "guest-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Ready-State guest-agent — Phase 8a binding-lease control plane (skeleton)."
homepage = "https://ato.run"
repository = "https://github.com/ato-run/ato"

# The guest-agent binary runs INSIDE the guest (built into the rootfs), not a
# distributed host CLI — cargo-dist must not try to package/MSI it.
[package.metadata.dist]
dist = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
protocol = { path = "../../../../crates/protocol" }
libc = "0.2"
# In-memory value digests for rotation detection (v1.4 hard gate) — digests are
# never logged, never persisted, never sent to the host.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
