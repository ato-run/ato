[package]
name = "ato-realization-planner"
version = "1.0.0"
edition = "2024"
license = "MPL-2.0"
description = "Explicit Realization path planner for Ato"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "planner"

[dependencies]
ato-adapter-api = { path = "../adapters/api", version = "1.0.0" }
ato-computation = { path = "../../lib/computation", version = "1.0.0" }
ato-materializer-api = { path = "../materializers/api", version = "1.0.0" }
ato-player = { path = "../player", version = "1.0.0" }
thiserror = "2"

[dev-dependencies]
ato-objects = { path = "../../lib/objects", version = "1.0.0" }
