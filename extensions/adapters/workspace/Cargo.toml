[package]
name = "ato-adapter-workspace"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MPL-2.0"
description = "Workspace boundary adapter for Ato"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "adapter"

[dependencies]
ato-adapter-api = { path = "../api", version = "0.1.0" }
ato-computation = { path = "../../../lib/computation", version = "0.1.0" }
ato-objects = { path = "../../../lib/objects", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

