[package]
name = "ato-adapter-oci"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/ato-run/ato"
description = "Runner-owned OCI execution adapter for Ato"
publish = false

[package.metadata.ato-architecture]
layer = "adapter"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"

[[bin]]
# The relay container's half of the protocol. It is built for a static Linux
# target by `scripts/build-oci-relay.sh` and embedded in this adapter.
name = "ato-oci-relay"
path = "src/bin/ato-oci-relay.rs"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3.23"
