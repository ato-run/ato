[package]
name = "ato-semantics-workspace"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MPL-2.0"
description = "Concrete repository workspace semantics for Ato computations"
homepage = "https://ato.run"
repository = "https://github.com/ato-run/ato"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "semantics"

[dependencies]
ato-computation = { path = "../../../lib/computation" }
ato-kernel = { path = "../../../lib/kernel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
thiserror = "2.0"
