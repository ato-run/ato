[package]
name = "ato-semantics-compose"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MPL-2.0"
description = "Concrete small-step composition semantics for Ato computations"
homepage = "https://ato.run"
repository = "https://github.com/ato-run/ato"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "semantics"

[dependencies]
blake3 = "1.5"
ato-computation = { path = "../../../lib/computation", version = "0.1.0" }
ato-kernel = { path = "../../../lib/kernel", version = "0.1.0" }
ato-objects = { path = "../../../lib/objects", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
thiserror = "2.0"

[dev-dependencies]
hex = "0.4"
