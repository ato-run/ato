[package]
name = "ato-materializer-vm-snapshot"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MPL-2.0"
description = "Generic VM snapshot Materializer for Ato"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "materializer"

[dependencies]
ato-computation = { path = "../../../lib/computation", version = "0.1.0" }
ato-materializer-api = { path = "../api", version = "0.1.0" }
ato-objects = { path = "../../../lib/objects", version = "0.1.0" }
ato-record-writer = { path = "../../record-writer", version = "0.1.0" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
ato-adapter-api = { path = "../../adapters/api", version = "0.1.0" }
