[package]
name = "ato-materializer-browser"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MPL-2.0"
description = "Portable browser localStorage materialization descriptors for Ato"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "app"

[dependencies]
ato-computation = { path = "../../../lib/computation", version = "0.1.0" }
ato-objects = { path = "../../../lib/objects", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
thiserror = "2"
