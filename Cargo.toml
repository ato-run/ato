[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/local-runtime",
    "apps/connected-realization-worker",
    "apps/formation-worker",
    "apps/native-surface-gateway",
    "apps/firecracker-guest-image",
    "apps/runtime-object-graph",
    "apps/portable-application",
    "lib/computation",
    "lib/kernel",
    "lib/local-execution",
    "lib/formation",
    "lib/runtime-attempt",
    "lib/objects",
    "lib/sandbox",
    "lib/ato-host-facts",
    "lib/tls-observe",
    "extensions/adapters/api",
    "extensions/adapters/process",
    "extensions/adapters/oci",
    "extensions/adapters/pty",
    "extensions/adapters/workspace",
    "extensions/adapters/binding",
    "extensions/adapters/http",
    "extensions/adapters/browser",
    "extensions/browser-host",
    "extensions/semantics/browser",
    "extensions/player",
    "extensions/record-writer",
    "lib/compose",
    "extensions/materializers/snapshot",
    "extensions/materializers/snapshot/guest-agent",
    "extensions/materializers/api",
    "extensions/materializers/static-web",
    "extensions/materializers/replay",
    "extensions/materializers/vm-snapshot",
    "extensions/materializers/browser",
    "extensions/contracts",
    "extensions/planner",
    "tools/snapshot-builder",
    "tools/arch-check",
    "tools/cert-export",
    "tools/receipt-authority",
    "tools/runtime-image-ledger",
    "lib/ipc",
    "lib/host-control",
    "services/netd",
    "services/capsulehub",
    "services/coordinator",
]

exclude = [
    "services/ato-tsnetd",
    "extensions/providers/nacelle",
    "extensions/semantics/workspace",
    "extensions/adapters/repository",
]

[workspace.package]
edition = "2024"
repository = "https://github.com/ato-run/ato"
homepage = "https://ato.run"
authors = ["ato-run"]

# Keep crate versions independent during M2 — package versions stay in each
# crate's Cargo.toml. The workspace-wide bump to 0.5.0 happens AFTER CI/CD
# is verified in the new monorepo (per the reordered M2→verify→bump plan).

# The `dist` profile drives cargo-dist's CLI release builds. Mirrors what
# The root profile is the canonical cargo-dist build profile.
[profile.dist]
inherits = "release"
lto = "thin"

# Keep local debug/test caches small: line tables keep backtraces usable
# while dropping full debuginfo, and incremental artifacts are not kept.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# Only the receipt-authority WASM artifact uses this profile. Native runtime
# builds retain their existing optimization/debug settings.
[profile.receipt-wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
