[workspace]
resolver = "2"
members = [
    "apps/cli",
    "lib/computation",
    "lib/kernel",
    "lib/objects",
    "extensions/adapters/api",
    "extensions/adapters/process",
    "extensions/adapters/pty",
    "extensions/adapters/workspace",
    "extensions/adapters/binding",
    "extensions/adapters/http",
    "lib/compose",
    "extensions/materializers/snapshot",
    "extensions/materializers/snapshot/guest-agent",
    "extensions/materializers/api",
    "extensions/materializers/replay",
    "tools/snapshot-builder",
    "tools/legacy-vm-inspector",
    "tools/arch-check",
    "lib/ipc",
    "services/netd",
]

# `desktop` (and its xtask) are kept OUT of the workspace because their
# git-only deps (`gpui`, `gpui-component`, `wry`, ...) lack crates.io versions
# and cause `cargo package --workspace` to fail. release-plz invokes
# `cargo package` to compute version diffs even for crates marked
# `release = false`, so excluding them entirely is the only reliable fix.
# Builds inside `apps/desktop/` still work — the directory just has its
# own Cargo.lock instead of sharing the workspace lockfile.
exclude = [
    "apps/desktop",
    "apps/desktop/xtask",
    "apps/desktop/.tmp",
    "apps/desktop/vendor",
    "services/ato-tsnetd",
    "extensions/providers/nacelle",
    "extensions/semantics/workspace",
    "extensions/adapters/repository",
]

[workspace.package]
edition = "2024"
repository = "https://github.com/ato-run/ato"
homepage = "https://ato.run"
authors = ["ato-run"]

# Keep crate versions independent during M2 — package versions stay in each
# crate's Cargo.toml. The workspace-wide bump to 0.5.0 happens AFTER CI/CD
# is verified in the new monorepo (per the reordered M2→verify→bump plan).

# The `dist` profile drives cargo-dist's CLI release builds. Mirrors what
# The root profile is the canonical cargo-dist build profile.
[profile.dist]
inherits = "release"
lto = "thin"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
