[package]
license = "MPL-2.0"
name = "snapshot-builder"
version = "1.0.0"
edition = "2024"
description = "Build opaque snapshot materializations for Ato computations"
publish = false

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "tool"

[[bin]]
name = "snapshot-builder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ato-computation = { path = "../../lib/computation", version = "1.0.0" }
ato-objects = { path = "../../lib/objects", version = "1.0.0" }
ato-materializer-snapshot = { path = "../../extensions/materializers/snapshot", version = "1.0.0" }
