[package]
name = "ato-receipt-authority"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ato-architecture]
layer = "tool"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ato-formation = { path = "../../lib/formation", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
