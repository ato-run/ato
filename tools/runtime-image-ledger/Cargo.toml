[package]
license = "MPL-2.0"
name = "ato-runtime-image-ledger"
version = "0.1.0"
edition = "2024"
publish = false
description = "Validate declared runtime image inventory and patch-candidate evidence"

[package.metadata.ato-architecture]
layer = "tool"

[[bin]]
name = "ato-runtime-image-ledger"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
