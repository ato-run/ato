[package]
name = "legacy-vm-inspector"
version = "0.1.0"
edition = "2024"
publish = false
description = "Read-only integrity inspection for historical Ato Ready-State CAS artifacts"

[package.metadata.ato-architecture]
layer = "tool"

[[bin]]
name = "legacy-vm-inspector"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"

[dev-dependencies]
tempfile = "3"
