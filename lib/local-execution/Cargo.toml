[package]
name = "ato-local-execution"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MPL-2.0"
description = "Local execution composition for Ato Computations: adapter/record/contract registries, the local realization driver, and the durable run supervisor"
homepage = "https://ato.run"
repository = "https://github.com/ato-run/ato"

# The composition that turns Ato's execution PRIMITIVES into a running local
# Computation. It was `pub(crate)` inside the CLI, which meant the only way to
# execute a Computation locally was to BE the CLI.
#
# Note what is absent: no vm-snapshot materializer and no Firecracker. VM
# Snapshot is an Ato SEMANTIC capability; Firecracker is one PHYSICAL backend
# for it, on Linux. Binding them together here would force every consumer —
# including a macOS Desktop runtime that will never boot a microVM — to link a
# Linux hypervisor. So the materializer registry is INJECTED by the composition
# root instead: the CLI supplies the full set including VM Snapshot, keeping its
# behaviour identical, and a Desktop runtime supplies only what it can realize.
#
# A future macOS VM Snapshot backend (Virtualization.framework) plugs in at the
# same seam, as another physical backend behind the same semantic capability.

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
# The composition layer, not a service: this crate's whole job is to wire
# adapters, materializers and the player together into a local execution host.
# It lives under lib/ because two hosts (the CLI and the Local Runtime) share
# it, but architecturally it sits where `apps/cli` sits.
layer = "app"

[lib]
name = "ato_local_execution"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
ato-adapter-api = { path = "../../extensions/adapters/api", version = "0.1.0" }
ato-adapter-binding = { path = "../../extensions/adapters/binding", version = "0.1.0" }
ato-adapter-browser = { path = "../../extensions/adapters/browser", version = "0.1.0" }
ato-adapter-http = { path = "../../extensions/adapters/http", version = "0.1.0" }
ato-adapter-process = { path = "../../extensions/adapters/process", version = "0.1.0" }
ato-adapter-pty = { path = "../../extensions/adapters/pty", version = "0.1.0" }
ato-adapter-workspace = { path = "../../extensions/adapters/workspace", version = "0.1.0" }
ato-browser-semantics = { path = "../../extensions/semantics/browser", version = "0.1.0" }
ato-compose = { path = "../compose", version = "0.1.0" }
ato-computation = { path = "../computation", version = "0.1.0" }
ato-contracts = { path = "../../extensions/contracts", version = "0.1.0" }
ato-materializer-api = { path = "../../extensions/materializers/api", version = "0.1.0" }
ato-materializer-replay = { path = "../../extensions/materializers/replay", version = "0.1.0" }
ato-materializer-snapshot = { path = "../../extensions/materializers/snapshot", version = "0.1.0" }
ato-objects = { path = "../objects", version = "0.1.0" }
ato-player = { path = "../../extensions/player", version = "0.1.0" }
ato-record-writer = { path = "../../extensions/record-writer", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
