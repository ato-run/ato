[package]
name = "ato-runtime-attempt"
version = "0.1.0"
edition = "2024"
description = "The Runtime's attempt: admission, start record, execution, observation, verification and receipt"
license = "Apache-2.0 OR MPL-2.0"
repository = "https://github.com/ato-run/ato"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "runtime"

[dependencies]
anyhow = "1"
ato-adapter-oci = { path = "../../extensions/adapters/oci", version = "0.1.0" }
ato-adapter-process = { path = "../../extensions/adapters/process", version = "0.1.0" }
ato-formation = { path = "../formation", version = "0.1.0" }
ato-ipc = { path = "../ipc", version = "0.1.0" }
ato-materializer-static-web = { path = "../../extensions/materializers/static-web", version = "0.1.0" }
ato-sandbox = { path = "../sandbox", version = "0.1.0" }
base64 = "0.22"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
