[package]
name = "ato-host-facts"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "What this host can do, measured without starting a workload"
repository = "https://github.com/ato-run/ato"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "lib"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
