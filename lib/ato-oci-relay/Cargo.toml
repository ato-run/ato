[package]
name = "ato-oci-relay"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Multiplexes logical TCP Ports of a Run's internal container network over one stdio stream"
repository = "https://github.com/ato-run/ato"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "lib"

[[bin]]
name = "ato-oci-relay"
path = "src/main.rs"

[lib]
name = "ato_oci_relay"
path = "src/lib.rs"

[dependencies]
