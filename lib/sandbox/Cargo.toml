[package]
name = "ato-sandbox"
version = "0.1.0"
edition = "2024"
description = "OS-native process sandbox policy and enforcement (Landlock / Seatbelt)"
license = "Apache-2.0 OR MPL-2.0"
repository = "https://github.com/ato-run/ato"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "lib"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
dirs = "5.0"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
