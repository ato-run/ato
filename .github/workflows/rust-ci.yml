name: Rust CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Diagnose formation worker tests
        run: cargo test -p ato-formation-worker --lib --locked -- --nocapture --test-threads=1
