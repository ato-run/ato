name: Rust CI

on:
  push:
    branches: [main, dev, nightly]
  pull_request:
    branches: [main, dev, nightly]
  workflow_dispatch:

# Public-repository CI: fork PRs run attacker-controlled code in this workflow,
# so it gets read-only repository access and never sees a secret. The ephemeral
# ato-ci pool executes each job in a fresh, network-isolated VM. See
# docs/ops/ci-selfhosted-runners.md for the untrusted-PR contract.
permissions:
  contents: read

# One in-flight run per ref. A new push to a PR supersedes its previous run;
# push runs on long-lived branches are never cancelled so every commit keeps a
# complete signal.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  workspace:
    name: workspace (${{ matrix.label }})
    # Linux runs on the self-hosted ephemeral ato-ci pool (one fresh VM per job,
    # no state reuse): runner label set [self-hosted, linux, x64, ato-ci].
    # macOS/Windows stay on GitHub-hosted runners because the pool has no such
    # capacity. `label` deliberately preserves the historical check names so
    # PR dashboards and required-check expectations do not shift.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest
            runner: [self-hosted, linux, x64, ato-ci]
          - label: macos-latest
            runner: [macos-latest]
          - label: windows-latest
            runner: [windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - uses: actions/setup-node@v4
        with:
          # Patched for CVE-2026-111497 (Node's bundled Brotli decoder); see
          # docs/ops/cve-2026-111497-node-brotli-20261024.md.
          node-version: "22.23.4"
      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The ephemeral ato-ci VM image already ships bubblewrap and patchelf.
          # Keep the apt-get path only as a fallback so a leaner image (or a
          # future host swap) cannot silently lose the isolation canary.
          if ! command -v bwrap >/dev/null 2>&1 || ! command -v patchelf >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap patchelf
          fi
          # The VM image enables unprivileged user namespaces. Only force the
          # sysctl when the image restricts them (Ubuntu 24.04+ default); never
          # fail just because the knob is already open.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" != "0" ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
          # Isolation canary: the sandbox / process-isolation tests need working
          # unprivileged user+mount namespaces. This fails the job when the
          # runner host cannot provide them — it is a gate, not a smoke test.
          # Disposable per-job VM; production admission is unchanged.
          bwrap --unshare-all --die-with-parent --new-session --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp -- /usr/bin/true
      - name: Provision declared Linux fixture toolchains
        if: runner.os == 'Linux'
        shell: bash
        # Tests resolve runtimes from the fixed /opt/ato/toolchains root
        # (lib/formation/src/intent.rs TOOLCHAIN_ROOT), so the ephemeral VM
        # contract grants the runner user passwordless sudo *inside the VM*.
        # This overwrites any image-baked copy with the exact toolchain that
        # setup-python / setup-node resolved for this job.
        run: |
          sudo mkdir -p /opt/ato/toolchains/python/3.12.7 /opt/ato/toolchains/node/22.23.4/bin
          sudo cp -a "$(python3 -c 'import sys; print(sys.prefix)')/." /opt/ato/toolchains/python/3.12.7/
          sudo cp "$(command -v node)" /opt/ato/toolchains/node/22.23.4/bin/node
          # The build sandbox clears LD_LIBRARY_PATH. Resolve the exact copied
          # libpython instead of the runner's different system libpython.
          sudo patchelf --set-rpath '$ORIGIN/../lib' /opt/ato/toolchains/python/3.12.7/bin/python3.12
          env -i PATH=/usr/bin:/bin /opt/ato/toolchains/python/3.12.7/bin/python3 -I -S -c 'import sys; assert sys.version_info[:3] == (3, 12, 7), sys.version'
          /opt/ato/toolchains/node/22.23.4/bin/node --version
      - run: cargo fmt --all -- --check
      - name: Check workspace
        if: runner.os != 'Windows'
        run: cargo check --workspace --all-targets --locked
      - name: Check host workspace (Windows)
        if: runner.os == 'Windows'
        # guest-agent and its Firecracker guest-image builder target the Linux
        # guest rootfs, not the Windows host. Exclude both so the latter cannot
        # pull guest-agent back into the dependency graph.
        run: cargo check --workspace --exclude guest-agent --exclude ato-firecracker-guest-image --all-targets --locked
      - name: Build the worker sandbox shim
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build -p ato-connected-realization-worker --locked
          echo "ATO_TEST_WORKER_BIN=$PWD/target/debug/ato-connected-realization-worker" >> "$GITHUB_ENV"
          python3 -I -S -c 'import sys; print(sys.executable); print(sys.version)'
      - name: Test workspace
        if: runner.os != 'Windows'
        run: cargo test --workspace --no-fail-fast
      - name: Derivation transformation v0 E2E (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: >-
          cargo test -p ato-cli --test derivation_transformation --locked --
          --nocapture
      - name: Upload transformation v0 evidence (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: transformation-v0-evidence
          path: target/transformation-v0-evidence/
          if-no-files-found: warn
      - name: Scenario verifier v1 E2E (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: >-
          cargo test -p ato-cli --test scenario_verification --locked --
          --nocapture
      - name: Upload scenario verifier v1 evidence (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: scenario-verifier-v1-evidence
          path: target/scenario-verifier-v1-evidence/
          if-no-files-found: warn
      - name: Stateful transformation E2E (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: >-
          cargo test -p ato-cli --test stateful_transformation --locked --
          --nocapture
      - name: Upload stateful transformation evidence (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: stateful-transformation-evidence
          path: target/stateful-transformation-evidence/
          if-no-files-found: warn
      - name: Portable worker regressions (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: |
          cargo test -p ato-formation-worker -p ato-connected-realization-worker --lib --locked --no-fail-fast
      # The workspace's execution E2Es exercise POSIX PTYs, /bin/sh paths,
      # Unix path policy, and Linux/macOS daemon lifecycle. Windows host code
      # is still compiled and linted here; portable CLI behavior is exercised
      # separately by cli-ci on windows-latest.
      - name: Clippy workspace
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy host workspace (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: cargo clippy --workspace --exclude guest-agent --exclude ato-firecracker-guest-image --all-targets --all-features --locked -- -D warnings
      - run: cargo run --locked -p arch-check
