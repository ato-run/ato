name: Rust CI

on:
  push:
    branches: [main, dev, nightly]
  pull_request:
    branches: [main, dev, nightly]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  process-isolation:
    name: Linux process isolation canaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATO_RUNNER_ISOLATION_TEST_HOST: "1"
      ATO_TEST_PARENT_CREDENTIAL: synthetic-parent-credential-canary
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap python3
      - name: Check actual namespaces, mounts, credential exclusion and host network positive control
        run: |
          mkdir -p .tmp
          export TMPDIR="$PWD/.tmp"
          cargo test --locked -p ato-connected-realization-worker --test process_isolation -- --ignored --test-threads=1 --nocapture

  workspace:
    name: workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo fmt --all -- --check
      - name: Check workspace
        if: runner.os != 'Windows'
        run: cargo check --workspace --all-targets --locked
      - name: Check host workspace (Windows)
        if: runner.os == 'Windows'
        # guest-agent is built into the Linux snapshot guest rootfs and has no
        # Windows host target. Every host-side package remains in this check.
        run: cargo check --workspace --exclude guest-agent --all-targets --locked
      - name: Test workspace
        if: runner.os != 'Windows'
        run: cargo test --workspace --no-fail-fast
      # The workspace's execution E2Es exercise POSIX PTYs, /bin/sh paths,
      # Unix path policy, and Linux/macOS daemon lifecycle. Windows host code
      # is still compiled and linted here; portable CLI behavior is exercised
      # separately by cli-ci on windows-latest.
      - name: Clippy workspace
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy host workspace (Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --exclude guest-agent --all-targets --all-features --locked -- -D warnings
      - run: cargo run --locked -p arch-check
