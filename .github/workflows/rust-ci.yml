name: Rust CI

# Workspace-wide CI for the ato monorepo. Runs cargo check / fmt / clippy /
# test against every workspace member. Crate-specific release workflows
# (ato-cli release.yml, ato-desktop desktop-release.yml) are intentionally
# kept separate and live in their own files.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: cargo check (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ato-desktop requires native GUI deps (webkit2gtk, etc.) not available
      # in the ubuntu-latest runner; excluded until M3 desktop CI bringup.
      - run: cargo check --workspace --all-targets --exclude ato-desktop

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --exclude ato-desktop -- -D warnings

  test:
    name: cargo test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # The Windows leg is informational for now: the ato-cli test suite had
    # never compiled (let alone run) on Windows before this leg existed, and
    # carries ~112 pre-existing failures (path separators, snapshots, unix
    # assumptions). It must not block dev integration while that parity debt
    # is paid down; see the Windows test-parity tracking issue.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      # The full workspace debug build with default debuginfo overflows the
      # ubuntu runner's disk ("No space left on device" at link time).
      # Line tables keep file:line in backtraces at a fraction of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free runner disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `ato-desktop` requires GPUI's heavy native deps (X11/Wayland on Linux,
      # Cocoa on macOS) which are not yet wired into CI. Limit the matrix to
      # `ato-cli` + shared core crates until M3 lands the desktop CI bringup.
      #
      # Build ato + nacelle binaries first so share_interactive_e2e tests can
      # resolve them from PATH (they spawn child processes during tests).
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Build test binaries
        shell: bash
        run: |
          cargo build -p ato-cli --bin ato
          cargo build -p nacelle --bin nacelle
          echo "$(pwd)/target/debug" >> $GITHUB_PATH
      - name: Run tests
        shell: bash
        run: |
          cargo test -p ato-cli --no-fail-fast
          cargo test -p capsule-core --no-fail-fast
          cargo test -p capsule-wire --no-fail-fast
          cargo test -p ato-session-core --no-fail-fast
          cargo test -p lock-draft-engine --no-fail-fast
