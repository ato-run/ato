name: Capsule execution-contract CI

# Focused gate for the `ato.execution-contract/v1` core in the `capsule` crate.
#
# The workspace `rust-ci.yml` only runs on PRs to `main` / `dev`, so 0.7 feature
# PRs targeting `nightly` (where this contract lands, ato-run/ato#1089) got no
# Rust test/clippy job. Rather than run the whole workspace CI on `nightly`
# (which would surface unrelated pre-existing lint/fmt debt), this path-filtered
# workflow runs exactly the contract's own gates on any PR that touches
# `crates/capsule`.

on:
  pull_request:
    paths:
      - "crates/capsule/**"
      - ".github/workflows/capsule-contract-ci.yml"
  push:
    branches: [main, dev, nightly]
    paths:
      - "crates/capsule/**"
      - ".github/workflows/capsule-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  execution-contract:
    name: capsule execution-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to the repo's rust-toolchain.toml channel (1.96.0). The default
      # `@stable` used by other workflows floats to the newest stable, which
      # can diverge from the pinned channel and surface version-dependent
      # fmt/clippy behaviour; this gate must match the toolchain the tree pins.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Prove the active toolchain is the pinned 1.96.0 (visible in the log).
      - run: rustc --version && cargo --version
      - run: cargo fmt -p capsule -- --check
      # `execution_contract` matches both the core module and the G0-2
      # `execution_contract_finalize` finalization gate (substring filter).
      - run: cargo test -p capsule --lib execution_contract
      # G0-2 lock integration (envelope D2 / lock_id exclusion D4 / env value D5).
      - run: cargo test -p capsule --lib ato_lock
      # G0-3 ato.snapshot-manifest/v1 identity + compatibility + selection (#1087).
      - run: cargo test -p capsule --lib snapshot_manifest
      - run: cargo test -p capsule --test execution_contract_vectors
      # Enforce the compile_fail guards on the VerifiedExecutionId seam — a raw
      # ExecutionId must never wrap into a VerifiedExecutionId. Lib/vector tests
      # do not run doctests, so run them explicitly (pinned toolchain).
      - run: cargo test -p capsule --doc -- VerifiedExecutionId
      - run: cargo clippy -p capsule --all-targets -- -D warnings
