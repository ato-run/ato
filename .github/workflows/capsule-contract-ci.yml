name: Capsule execution-contract CI

# Focused gate for the `ato.execution-contract/v1` core in the `capsule` crate.
#
# The workspace `rust-ci.yml` only runs on PRs to `main` / `dev`, so 0.7 feature
# PRs targeting `nightly` (where this contract lands, ato-run/ato#1089) got no
# Rust test/clippy job. Rather than run the whole workspace CI on `nightly`
# (which would surface unrelated pre-existing lint/fmt debt), this path-filtered
# workflow runs exactly the contract's own gates on any PR that touches
# `crates/capsule`.

on:
  pull_request:
    paths:
      - "crates/capsule/**"
      - ".github/workflows/capsule-contract-ci.yml"
  push:
    branches: [main, dev, nightly]
    paths:
      - "crates/capsule/**"
      - ".github/workflows/capsule-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  execution-contract:
    name: capsule execution-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to the repo's rust-toolchain.toml channel (1.96.0). The default
      # `@stable` used by other workflows floats to the newest stable, which
      # can diverge from the pinned channel and surface version-dependent
      # fmt/clippy behaviour; this gate must match the toolchain the tree pins.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Prove the active toolchain is the pinned 1.96.0 (visible in the log).
      - run: rustc --version && cargo --version
      - run: cargo fmt -p capsule -- --check
      # The whole capsule unit-test suite, deliberately unfiltered.
      #
      # This step used to be a curated list of module filters, which is unsound
      # twice over. A filtered `cargo test` exits 0 when the filter matches
      # NOTHING (libtest has no `--fail-if-no-tests`; that flag is nextest-only),
      # so a rename silently retires a gate — `ato_lock` -> `capsule_lock`
      # (CAPSULE_V1_EXECUTION_MODEL_SPEC §5) did exactly that. A guard was added
      # for that direction, but it cannot see the opposite failure: a module no
      # filter names is never run at all, which is how
      # `foundation::common::lock_presence` (6 tests) and
      # `routing::input_resolver` (20 tests) shipped with no CI coverage on this
      # branch — `rust-ci.yml`, which would have caught them, only runs on
      # `main`/`dev`.
      #
      # Running every test in the crate removes both failure modes by
      # construction: there is no list to drift. It stays scoped to `-p capsule`
      # rather than the workspace, so this gate still does not surface unrelated
      # pre-existing debt in other crates.
      - run: cargo test -p capsule --lib
      - run: cargo test -p capsule --test execution_contract_vectors
      - run: cargo test -p capsule --test capsule_program_vectors
      # Enforce the compile_fail guards on every proof-carrying seam: a raw
      # ExecutionId must never wrap into a VerifiedExecutionId, a raw
      # CapsuleProgramId never into a VerifiedCapsuleProgramId, and a bare
      # &Path never into a VerifiedPinnedSourceMaterialization (ADR-014 §1/§4).
      # Lib/vector tests do not run doctests, so run them explicitly — behind
      # the same empty-filter guard, since a renamed type would otherwise
      # silently retire the compile_fail proofs.
      #
      # The three filters must partition every doctest in the crate: the
      # coverage check below fails if the crate grows a doctest no filter
      # reaches, so a future proof seam cannot be added-but-unenforced.
      - name: proof-carrying id doctests (fail closed on an empty filter)
        run: |
          set -euo pipefail
          # Capture the status explicitly instead of letting `set -e` abort on
          # the assignment: `out=$(cargo test …)` fails BEFORE `echo "$out"`
          # runs, so a genuine test failure used to leave nothing in the log but
          # the ::group:: header. Never let a diagnostic-carrying command abort
          # its own diagnostic.
          run_doctests() {
            local filter="$1" status=0
            echo "::group::cargo test -p capsule --doc -- $filter"
            out=$(cargo test -p capsule --doc -- "$filter" 2>&1) || status=$?
            echo "$out"
            echo "::endgroup::"
            return "$status"
          }
          covered=0
          for filter in VerifiedExecutionId CapsuleProgram PinnedSource; do
            if ! run_doctests "$filter"; then
              echo "::error::doctest filter '$filter' failed — see the group above"
              exit 1
            fi
            n=$(grep -oE 'test result: ok\. [0-9]+ passed' <<<"$out" | grep -oE '[0-9]+' | paste -sd+ - | bc)
            if [ "${n:-0}" -eq 0 ]; then
              echo "::error::doctest filter '$filter' matched no tests (renamed type?)"
              exit 1
            fi
            covered=$((covered + n))
          done
          # Denominator is the crate's compile_fail doctests — i.e. exactly the
          # proof seams. (Ordinary documentation examples are doctests too and
          # must NOT be counted, or this gate would fail on unrelated docs.)
          # `grep -c` exits 1 on zero matches, which under `pipefail` would abort
          # this step with no message at all — so tolerate it and report the
          # zero-seam case as the explicit error it is.
          all_doctests=$(cargo test -p capsule --doc 2>&1) || {
            echo "$all_doctests"
            echo "::error::the full doctest run failed — see above"
            exit 1
          }
          seams=$(grep -c ' - compile fail \.\.\. ok$' <<<"$all_doctests" || true)
          echo "proof-seam doctests covered: $covered of $seams compile_fail doctests"
          if [ "$covered" -ne "$seams" ]; then
            echo "::error::$((seams - covered)) compile_fail doctest(s) are not reached by any filter above — a new proof seam was added without its filter"
            exit 1
          fi
      - run: cargo clippy -p capsule --all-targets -- -D warnings
