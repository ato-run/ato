name: Capsule Protocol cross-job E2E

on:
  pull_request:
    paths:
      - "crates/capsule-protocol/**"
      - "crates/capsule-codec/**"
      - "crates/capsule/src/protocol_*.rs"
      - "crates/capsule/examples/protocol_e2e_fixture.rs"
      - ".github/workflows/capsule-protocol-e2e.yml"
  push:
    branches: [main, dev, nightly]
    paths:
      - "crates/capsule-protocol/**"
      - "crates/capsule-codec/**"
      - "crates/capsule/src/protocol_*.rs"
      - "crates/capsule/examples/protocol_e2e_fixture.rs"
      - ".github/workflows/capsule-protocol-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  protocol-e2e-produce:
    name: protocol-e2e-produce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Produce portable Capsule with fresh local state
        shell: bash
        env:
          ATO_HOME: ${{ github.workspace }}/.tmp/protocol-producer/ato-home
        run: |
          set -euo pipefail
          mkdir -p .tmp/protocol-transfer
          cargo run -p capsule --example protocol_e2e_fixture -- produce .tmp/protocol-transfer/portable.capsule
          test -s .tmp/protocol-transfer/portable.capsule
      - uses: actions/upload-artifact@v4
        with:
          name: capsule-protocol-portable
          path: .tmp/protocol-transfer/portable.capsule
          if-no-files-found: error

  protocol-e2e-consume:
    name: protocol-e2e-consume
    needs: protocol-e2e-produce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Download producer artifact only
        uses: actions/download-artifact@v4
        with:
          name: capsule-protocol-portable
          path: .tmp/protocol-consumer
      - name: Validate closure, replay actual egress, and Continue
        shell: bash
        env:
          ATO_HOME: ${{ github.workspace }}/.tmp/protocol-consumer/ato-home
        run: |
          set -euo pipefail
          test ! -e .tmp/protocol-producer
          output="$(cargo run -p capsule --example protocol_e2e_fixture -- consume .tmp/protocol-consumer/portable.capsule)"
          grep -F "replay=HISTORICAL; continue=CONTINUE" <<<"$output"
