name: computation architecture

on:
  push:
    paths: ["**/Cargo.toml", "Cargo.lock", "tools/arch-check/**"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "tools/arch-check/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo metadata --format-version 1 --locked > /dev/null
      - run: cargo run --locked -p arch-check
