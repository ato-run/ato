name: computation architecture

on:
  push:
    paths: ["**/Cargo.toml", "Cargo.lock", "tools/arch-check/**"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "tools/arch-check/**"]
  workflow_dispatch:

# Public-repository CI: fork PRs run attacker-controlled code here, so the
# workflow stays read-only and secret-free.
permissions:
  contents: read

# One in-flight run per ref; only PR runs are cancelled by a newer push.
concurrency:
  group: dep-direction-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture:
    runs-on: [self-hosted, linux, x64, ato-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo metadata --format-version 1 --locked > /dev/null
      - run: cargo run --locked -p arch-check
