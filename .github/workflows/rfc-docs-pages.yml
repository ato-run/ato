name: Docs Pages

# Deployment path, not CI: publishing stays on GitHub-hosted runners because the
# github-pages environment, its OIDC identity and `actions/deploy-pages` are
# tied to GitHub-hosted publishing. It is never routed to the self-hosted ato-ci
# pool (docs/ops/ci-selfhosted-runners.md). Only main pushes can trigger it, so
# fork PRs cannot reach it.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/rfc-docs-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
