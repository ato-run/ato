name: Staging CLI release

# macOS arm64 is the current native staging acceptance target. This workflow
# has no production, Homebrew or stable-latest publishing step.
on:
  push:
    tags: ['v*-stg']

permissions:
  contents: write

concurrency:
  group: staging-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      ATO_BUILD_REQUIRE_GIT_SHA: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require integrated staging source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/stg
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-stg', tag), tag
          version = tomllib.loads(pathlib.Path('apps/cli/Cargo.toml').read_text())['package']['version']
          assert tag == 'v' + version, (tag, version)
          PY
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh
      - name: Build staging artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: dist build --artifacts local --target aarch64-apple-darwin --tag "$RELEASE_TAG" --output-format=json > staging-dist-manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: staging-cli-macos-arm64
          path: |
            target/distrib/ato-cli-aarch64-apple-darwin.tar.xz
            target/distrib/ato-cli-aarch64-apple-darwin.tar.xz.sha256
            staging-dist-manifest.json
      - name: Publish prerelease without updating latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p .tmp
          cat > .tmp/staging-release-notes.md <<EOF
          Staging-only CLI candidate for macOS arm64, source ${GITHUB_SHA}.

          Install using the macOS arm64 archive and checksum attached below.
          This prerelease does not update production, stable latest, or Homebrew.
          Other platforms are not included in this staging candidate.
          EOF
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
            --title "ato-cli ${RELEASE_TAG#v} (staging, macOS arm64)" \
            --notes-file .tmp/staging-release-notes.md \
            target/distrib/ato-cli-aarch64-apple-darwin.tar.xz \
            target/distrib/ato-cli-aarch64-apple-darwin.tar.xz.sha256 \
            staging-dist-manifest.json
