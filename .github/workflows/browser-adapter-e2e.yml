name: Browser Adapter E2E

on:
  push:
    branches: [main, dev, nightly]
    paths:
      - "apps/cli/**"
      - "extensions/adapters/**"
      - "extensions/materializers/replay/**"
      - "lib/**"
      - "tests/browser/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/browser-adapter-e2e.yml"
  pull_request:
    branches: [main, dev, nightly, feat/browser-adapter]
    paths:
      - "apps/cli/**"
      - "extensions/adapters/**"
      - "extensions/materializers/replay/**"
      - "lib/**"
      - "tests/browser/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/browser-adapter-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: cargo build --locked -p ato-cli
      - run: npm ci
        working-directory: tests/browser
      # GitHub's Ubuntu image already carries Chromium's shared-library
      # dependencies. Avoid `--with-deps`: it runs apt update and can stall on
      # an unavailable runner mirror before either Browser E2E executes.
      - run: npx playwright install chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
        env:
          ATO_BIN: ${{ github.workspace }}/target/debug/ato
      - run: |
          chrome="$(node -p "require('./tests/browser/node_modules/@playwright/test').chromium.executablePath()")"
          python3 tests/browser/staging-chrome-acceptance.py \
            --ato "${{ github.workspace }}/target/debug/ato" \
            --chrome "$chrome" \
            --repository "${{ github.workspace }}" \
            --work-root "${{ github.workspace }}/.tmp/browser-host-acceptance" \
            --receipt "${{ github.workspace }}/.tmp/browser-host-acceptance/receipt.json" \
            --browser-host
