# Isolated Tauri desktop shell build gate.
#
# The Tauri shell lives in apps/desktop-tauri and is excluded from the root
# Cargo workspace, so the workspace-level `rust-ci.yml` gate never compiles it.
# This workflow is the dedicated gate for that crate plus the two things a
# Tauri change can break indirectly:
#   - the root workspace (path deps into lib/ipc and lib/host-control, and the
#     root Cargo.toml `exclude` list) — gated by `rust-ci.yml` on the same
#     branches/PRs, so it is intentionally not duplicated here;
#   - the existing GPUI + Wry desktop shell (regression), gated below.
#
# The real-macOS smoke evidence in PR #1287's Definition of Done is a manual
# checklist, not a CI job; the `tauri` job below is the automated compile/test
# gate that must pass before that smoke run.

name: desktop-tauri-ci

on:
  push:
    branches: [main, dev, nightly]
  pull_request:
    branches: [main, dev, nightly]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  current-desktop-regression:
    name: current desktop regression (macOS)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: current-desktop-${{ runner.os }}
      - name: Test existing GPUI + Wry desktop
        working-directory: apps/desktop
        run: cargo test

  tauri:
    name: tauri shell (macOS)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-${{ runner.os }}

      # The Tauri shell resolves the CLI at runtime; build the CLI release so a
      # future bundle step can stage it as a sibling and to prove it compiles.
      - name: Build ato CLI (release)
        run: cargo build --release -p ato-cli

      - name: Install tauri-cli
        run: cargo install tauri-cli --version 2 --locked

      - name: Format check
        working-directory: apps/desktop-tauri
        run: cargo fmt -- --check

      - name: Test
        working-directory: apps/desktop-tauri
        run: cargo test --all-features

      - name: Clippy
        working-directory: apps/desktop-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build bundle
        working-directory: apps/desktop-tauri
        run: cargo tauri build
