name: Documentation acceptance

on:
  pull_request:
    branches: [dev, stg, main]
    paths: ["docs/**", "README*.md", "CONTRIBUTING.md", "scripts/docs-*", ".github/workflows/docs-ci.yml"]
  push:
    branches: [dev, stg]
    paths: ["docs/**", "README*.md", "CONTRIBUTING.md", "scripts/docs-*", ".github/workflows/docs-ci.yml"]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check current links and reject new historical failures
        run: python3 scripts/docs-audit.py --allow-historical-from docs/archive/2026/documentation-reorganization/link-audit.json --output .tmp/docs-ci-links.json
      - name: Check the README first example
        run: |
          grep -F 'ato run samples/interop-static.capsule --no-open' README.md
          if grep -F 'ato pack samples/interop-static-k' README.md; then
            echo "README still contains the retired ato.capsule/1 example"
            exit 1
          fi
