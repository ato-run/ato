name: fork secret probe

# Deliberately hostile-shaped workflow used to prove that a pull request from a
# fork cannot obtain repository secrets and cannot write with GITHUB_TOKEN, and
# that its job still runs in the same disposable, network-isolated VM.
# It only reads environment variables and attempts one denied API write.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, ato-ci]
    timeout-minutes: 10
    steps:
      - name: Repository secrets must be empty
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TAP: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          APPLE: ${{ secrets.APPLE_ID }}
        run: |
          set -uo pipefail
          leak=0
          for name in CF TAP APPLE; do
            value="${!name}"
            if [ -n "$value" ]; then echo "LEAK: $name exposed"; leak=1; else echo "ok: $name empty"; fi
          done
          exit "$leak"
      - name: GITHUB_TOKEN must be read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -X POST "repos/${{ github.repository }}/git/refs" \
               -f ref=refs/heads/fork-probe-write -f sha="${{ github.sha }}" >/dev/null 2>&1; then
            echo "LEAK: GITHUB_TOKEN could write"; exit 1
          else
            echo "ok: GITHUB_TOKEN is read-only"
          fi
      - name: Where did this run and can it reach the host
        run: |
          echo "hostname=$(hostname)"; id; echo "kernel=$(uname -r)"
          ip -4 -brief addr show scope global
          if timeout 3 bash -c "exec 3<>/dev/tcp/192.168.0.92/22" 2>/dev/null; then echo "LEAK: host reachable"; exit 1; else echo "ok: host unreachable"; fi
