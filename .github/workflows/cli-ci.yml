name: computation CLI

on:
  push:
    paths: ["apps/cli/**", "lib/**", "extensions/**", "Cargo.toml", "Cargo.lock"]
  pull_request:
    paths: ["apps/cli/**", "lib/**", "extensions/**", "Cargo.toml", "Cargo.lock"]
  workflow_dispatch:

# Public-repository CI: fork PRs run attacker-controlled code in this workflow,
# so it gets read-only repository access and never sees a secret.
permissions:
  contents: read

# One in-flight run per ref; only PR runs are cancelled by a newer push.
concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    name: cli (${{ matrix.label }})
    # Linux runs on the self-hosted ephemeral ato-ci pool; macOS/Windows stay on
    # GitHub-hosted runners (no self-hosted capacity for them). `label` keeps
    # the historical check names stable.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest
            runner: [self-hosted, linux, x64, ato-ci]
          - label: macos-latest
            runner: [macos-latest]
          - label: windows-latest
            runner: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The portable process fixture declares this runtime. Installing it
      # makes the process tests exercise execution rather than host admission.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        name: Windows durable attempt journal
        run: cargo test -p ato-runtime-attempt --lib journal::tests -- --test-threads=1
      - if: runner.os != 'Windows'
        run: cargo test -p ato-cli -p ato-adapter-api -p ato-adapter-binding -p ato-adapter-http -p ato-adapter-process -p ato-adapter-pty -p ato-adapter-workspace -p ato-kernel -p ato-objects
      - if: runner.os == 'Windows'
        run: cargo test -p ato-cli -p ato-adapter-api -p ato-adapter-binding -p ato-adapter-http -p ato-adapter-process -p ato-adapter-pty -p ato-adapter-workspace -p ato-kernel -p ato-objects -- --test-threads=1 --nocapture
      - run: cargo clippy -p ato-cli --all-targets -- -D warnings
