[package]
name = "snapshot"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
homepage = "https://ato.run"
repository = "https://github.com/ato-run/ato"
description = "Backend-agnostic build/restore of Ready-State Capsule warm state. Defines SnapshotBackend + Ready-State artifact types; ships a KVM-free FakeSnapshotBackend and a Firecracker skeleton (Unsupported without /dev/kvm)."

[package.metadata.dist]
dist = false

[lib]
name = "snapshot"
path = "src/lib.rs"

# Dev/KVM-host latency benchmark tool (not part of the product CLI).
[[bin]]
name = "ready-state-bench"
path = "src/bin/ready_state_bench.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
capsule = { path = "../capsule" }
capsulefs = { path = "../capsulefs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
thiserror = "2.0"
# U1 (#854): the UFFD page-server uses raw userfaultfd ioctls + SCM_RIGHTS recvmsg
# (Linux-only; the module body is cfg(target_os="linux")-gated).
libc = "0.2"

[dev-dependencies]
protocol = { path = "../protocol" }
serde_json = "1.0"
tempfile = "3"
