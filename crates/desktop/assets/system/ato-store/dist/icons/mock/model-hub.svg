<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="32" fill="#f5f3ff"/>
  <!-- Triangle edges -->
  <line x1="32" y1="12" x2="52" y2="46" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="12" x2="12" y2="46" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="46" x2="52" y2="46" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center connection lines -->
  <line x1="32" y1="12" x2="32" y2="46" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>
  <line x1="12" y1="46" x2="52" y2="12" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>
  <line x1="52" y1="46" x2="12" y2="12" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>
  <!-- Nodes at vertices -->
  <circle cx="32" cy="12" r="5" fill="#7c3aed"/>
  <circle cx="12" cy="46" r="5" fill="#7c3aed"/>
  <circle cx="52" cy="46" r="5" fill="#7c3aed"/>
</svg>
