[workspace]

[package]
name = "ato-desktop-xtask"
# Must track ato-desktop's version because xtask reads
# env!("CARGO_PKG_VERSION") to embed into MSI/DMG/AppImage filenames.
version = "0.7.3"
edition = "2024"
# Internal build helper — never published. Excluded from the workspace
# (see root Cargo.toml) so release-plz's `cargo package` step skips it.
publish = false

# Internal build helper — never shipped via cargo-dist.
[package.metadata.dist]
dist = false

[dependencies]
anyhow = "1.0"
# Pure-Rust sha256 so the `--helper-source release` path can verify the
# checksum of consumed cargo-dist artifacts deterministically, without
# shelling out to three different platform tools (shasum/sha256sum/certutil).
sha2 = "0.10"
