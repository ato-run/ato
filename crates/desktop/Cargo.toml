# Standalone workspace marker. The parent `apps/ato/Cargo.toml` excludes
# this directory from its workspace, but Cargo's exclude paths are
# relative to the parent manifest, so they don't match when ato-desktop
# is checked out under `.worktrees/<branch>/crates/ato-desktop/`. The
# empty `[workspace]` block here makes the crate its own workspace
# regardless of where the directory lives, so `cargo check` /
# `cargo build` inside the worktree resolves dependencies through the
# crate-local `Cargo.lock` (already committed alongside) instead of
# tripping the parent's exclude logic.
[workspace]

[package]
name = "desktop"
version = "0.7.1"
edition = "2024"
authors = ["ato-run"]
description = "The universal user plane for executing and orchestrating sandboxed app capsules."
license = "MPL-2.0"
build = "build.rs"
# Not published to crates.io. ato-desktop pulls in non-published git deps
# (gpui, wry, gpui-component, ...) that crates.io packaging cannot resolve,
# and the desktop bundle ships via DMG/MSI/AppImage rather than `cargo install`.
# Note: publish = false alone is NOT enough — `cargo package --workspace`
# (which release-plz invokes) ignores the publish flag. The crate is also
# kept out of the workspace `members` list (see root Cargo.toml `exclude`)
# so workspace-wide cargo operations skip it entirely.
publish = false

# Opt out of cargo-dist (the CLI release pipeline). Desktop bundles
# are produced by `crates/ato-desktop/xtask` and shipped via
# `.github/workflows/desktop-release.yml`. Without this gate cargo-dist
# scans the [[bin]] targets, demands MSI metadata (WiX upgrade-guid /
# path-guid), and would publish a redundant Windows MSI alongside the
# xtask-built one.
[package.metadata.dist]
dist = false

[lib]
name = "desktop"
path = "src/lib.rs"

[[bin]]
name = "ato-desktop"
path = "src/main.rs"

[[bin]]
name = "ato-desktop-mcp"
path = "src/bin/ato_desktop_mcp.rs"

[features]
gpui-inspector = ["gpui-component/inspector"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1"
include_dir = "0.7"
capsule = { path = "../capsule", version = "0.11.0" }
protocol = { path = "../protocol", version = "0.1.0" }
cookie = "0.18"
dirs = "5.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "15d86607" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "15d86607", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/ato-run/gpui-component", rev = "00ea23fbf0d15e229c9ec3034b2c3c16846908f9" }
gpui-component-assets = { git = "https://github.com/ato-run/gpui-component", rev = "00ea23fbf0d15e229c9ec3034b2c3c16846908f9" }
http = "1.4.0"
# ico / image / usvg / resvg / tiny-skia: pre-normalize favicons to PNG
# before handing bytes to GPUI's `Image::from_bytes`. We need this for
# two reasons:
#
# 1. The pinned `gpui` rev's SVG path passes `to_brga = false` to the
#    SVG renderer (gpui platform.rs:2109-2113), leaving the buffer in
#    RGBA-PA when the rest of GPUI expects BGRA — the image renders
#    invisibly on Metal.
# 2. The `image` crate's ICO parser strictly validates ICONDIRENTRY's
#    reserved/planes/bitcount fields and rejects real-world favicons
#    served by Google (gstatic), MDN, and others ("ICO image entry has
#    too many color planes or too large hotspot value"), even though
#    every browser renders them fine. The `ico` crate is purpose-built
#    and lenient, supporting both PNG-encoded and DIB-encoded entries.
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.45"
tiny-skia = "0.11"
usvg = "0.45"
percent-encoding = "2"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
unicode-width = "0.2"
ureq = { version = "2.12.1", features = ["json"] }
url = "2.5.4"
wry = { version = "0.55.0", features = ["protocol", "devtools"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }
raw-window-handle = "0.6"
# Windows notification-area tray (KOH-41). Default features pull in the Linux
# gtk/libxdo backends; this dep is Windows-only so we disable them.
tray-icon = { version = "0.24.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-web-kit = "0.3.2"
# `raw-window-handle` is already pulled in transitively (gpui, wry).
# Declared as a direct dep here so `window/macos.rs` can call
# `gpui::Window::window_handle()` to descend to NSWindow and wire
# `addChildWindow:ordered:` for the Focus View Control Bar (#171).
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
serial_test = { version = "3", features = ["log"] }
chrono = { version = "0.4", default-features = true }
