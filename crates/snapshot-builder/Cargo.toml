[package]
name = "snapshot-builder"
version = "0.1.0"
edition = "2024"
description = "Track C snapshot builder daemon: claims capsule-snapshot jobs from ato-api, materializes the server-resolved source, builds a Ready-State artifact, seals + no-secret-scans it, and acks. Dev/ops tool (not shipped)."
publish = false

# dev/ops tool — never shipped in a release.
[package.metadata.dist]
dist = false

[[bin]]
name = "snapshot-builder"
path = "src/main.rs"

[dependencies]
snapshot = { path = "../snapshot" }
capsule = { path = "../capsule" }
protocol = { path = "../protocol" }
capsulefs = { path = "../capsulefs" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12.1", features = ["json"] }
tungstenite = "0.28"
# Submission-wizard lease driver only: `lease_expires_at` (§3.1/§3.2) is an
# ISO-8601 UTC wall-clock instant, and the renew cadence is derived from it.
# Reused from the workspace (cli/capsule/desktop/nacelle already depend on the
# same 0.4) rather than hand-rolling a civil-date parser.
chrono = { version = "0.4", default-features = true }
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
libc = "0.2"
ed25519-dalek = "2.0"
serde_jcs = "0.1"
unicode-normalization = "0.1"
# v1 intake refusals (`v1_intake::V1IntakeRefusal`) are a typed enum rather than
# this file's usual `(stage, reason)` tuple: each variant is a distinct thing
# wrong with the world that a test asserts on by shape, and the operator's next
# action differs between them. Same 2.0 the rest of the workspace pins
# (capsule/snapshot/cli).
thiserror = "2.0"
tempfile = "3"

[dev-dependencies]
# Re-declare `snapshot` with the non-default `test-support` feature so the
# HoldPhase unit tests (crate::hold_phase) can mint a
# `VerifiedRunningSnapshotEligibility` via `for_test`/`analyze_for_test` to seed
# the #1088 `accept()` path without a production eligibility constructor. This
# activation is dev-only: a normal `cargo build -p snapshot-builder` does not
# pull the feature, so no shipped path gains a non-production constructor.
snapshot = { path = "../snapshot", features = ["test-support"] }
