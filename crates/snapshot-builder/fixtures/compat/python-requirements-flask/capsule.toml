# v1 compat: python with a pinned requirements.txt — exercises the pip install path.
schema_version = "0.3"
name = "compat-python-requirements-flask"
version = "0.1.0"
type = "app"
default_target = "app"

[targets.app]
runtime = "source"
run = "python3 app.py"
port = 8080
readiness_probe = { http_get = "/health" }
