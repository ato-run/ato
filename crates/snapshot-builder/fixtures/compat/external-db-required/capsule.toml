# v1 compat NEGATIVE: required external service — must fail eligibility (R3).
schema_version = "0.3"
name = "compat-external-db-required"
version = "0.1.0"
type = "app"
default_target = "web"

[targets.web]
runtime = "source"
driver = "python"
run = "python3 app.py"
port = 8080

[external.db]
type = "service"
required = true
provider = "postgres"
