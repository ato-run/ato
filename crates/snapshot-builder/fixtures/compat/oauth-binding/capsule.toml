# v1 compat NEGATIVE: oauth binding (BindingKind::Oauth) — no-binding only (R2).
schema_version = "0.3"
name = "compat-oauth-binding"
version = "0.1.0"
type = "app"
default_target = "app"

[targets.app]
runtime = "source"
driver = "python"
run = "python3 app.py"
port = 8080

[bindings.github_oauth]
kind = "oauth"
required = true
