# v1 compat NEGATIVE: binds 127.0.0.1 — eligibility PASSES, but boot-verify
# probes over the TAP (172.16.0.2), where a loopback-bound server is
# unreachable. Must fail at build_ready_state, never seal.
schema_version = "0.3"
name = "compat-localhost-only-bind"
version = "0.1.0"
type = "app"
default_target = "app"

[targets.app]
runtime = "source"
driver = "python"
run = "python3 app.py"
port = 8080
readiness_probe = { http_get = "/health" }
