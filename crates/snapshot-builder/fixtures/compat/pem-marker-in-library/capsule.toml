# v1 compat GUARANTEE fixture: a PEM format-marker string constant inside a
# vendored library file (the shape that false-positived every real app before
# #935). The seal must SUCCEED: PEM literals in CAS files are ADVISORY (path-only,
# recorded in the receipt), never a gate. manifest.json keeps its PEM gate.
schema_version = "0.3"
name = "compat-pem-marker-in-library"
version = "0.1.0"
type = "app"
default_target = "app"

[targets.app]
runtime = "source"
run = "python3 app.py"
port = 8080
readiness_probe = { http_get = "/health" }
