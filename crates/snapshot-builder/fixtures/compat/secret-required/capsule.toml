# v1 compat NEGATIVE: a required secret — v1 is no-binding; must fail eligibility (R1).
schema_version = "0.3"
name = "compat-secret-required"
version = "0.1.0"
type = "app"
default_target = "app"

[targets.app]
runtime = "source"
driver = "python"
run = "python3 app.py"
port = 8080

[secrets.OPENAI_API_KEY]
required = true
env = "OPENAI_API_KEY"
