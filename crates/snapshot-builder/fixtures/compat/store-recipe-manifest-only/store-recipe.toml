# v1 compat: recipe-as-manifest — the repo ships NO capsule.toml; this file is the
# APPROVED Store recipe the seed script stores in capsule_source_recipes.recipe_toml.
# The builder claim carries it and writes it as capsule.toml (manifest_source=recipe_toml),
# authoritative over anything in the repository.
schema_version = "0.3"
name = "compat-store-recipe-manifest-only"
version = "0.1.0"
type = "app"
default_target = "app"

[targets.app]
runtime = "source"
driver = "python"
run = "app.py"
port = 8080
