# Track C PR 2b fixture: a minimal public, no-binding, stdlib-python web capsule the
# builder daemon can materialize + build end-to-end. No secrets/bindings/external/GPU.
schema_version = "0.3"
name = "trackc-pr2b-py-web"
version = "0.1.0"
type = "app"
default_target = "app"

[targets.app]
runtime = "source"
run = "python3 app.py"
port = 8080
readiness_probe = { http_get = "/health" }
