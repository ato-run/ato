[package]
name = "capsule-core-codec"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MPL-2.0"
description = "Canonical identity codec and verified resolver for sealed Ato computations"
homepage = "https://ato.run"
repository = "https://github.com/ato-run/ato"

[package.metadata.dist]
dist = false

[dependencies]
blake3 = "1.5"
capsule-core = { path = "../capsule-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
thiserror = "2.0"

[dev-dependencies]
hex = "0.4"
