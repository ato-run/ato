[package]
name = "capsule-session-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MPL-2.0"
description = "Ato runtime domain for durable Capsule sessions and Connector Drivers"
homepage = "https://ato.run"
repository = "https://github.com/ato-run/ato"

[package.metadata.dist]
dist = false

[dependencies]
blake3 = "1.5"
capsule-protocol = { path = "../capsule-protocol" }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
