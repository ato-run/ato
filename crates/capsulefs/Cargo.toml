[package]
name = "capsulefs"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
homepage = "https://ato.run"
repository = "https://github.com/ato-run/ato"
description = "Content-addressed, chunked, lazily-read local store for Ready-State Capsule layers (rootfs/runtime/deps/app/vmstate/memory). Stage 1: File backend."

[package.metadata.dist]
dist = false

[lib]
name = "capsulefs"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
fastcdc = "3.2"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
