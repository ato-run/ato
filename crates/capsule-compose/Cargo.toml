[package]
name = "capsule-compose"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MPL-2.0"
description = "Canonical residual and validator for capsule.compose@1"
homepage = "https://ato.run"
repository = "https://github.com/ato-run/ato"

[package.metadata.dist]
dist = false

[dependencies]
blake3 = "1.5"
capsule-core = { path = "../capsule-core" }
capsule-core-codec = { path = "../capsule-core-codec" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
thiserror = "2.0"

[dev-dependencies]
hex = "0.4"
