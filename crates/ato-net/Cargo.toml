[package]
name = "ato-net"
version = "0.5.2"
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
description = "ato network plane: shared types + control-plane client for ato-netd. Per #294 / #296, this crate hosts the API surface; module placeholders for resolver / policy / proxy_core / receipt / stable_origin are filled in by follow-up slices (B–G)."
repository = "https://github.com/ato-run/ato"
homepage = "https://ato.run"
authors = ["Koh0920"]
keywords = ["network", "dns", "proxy", "ato"]
categories = ["network-programming"]
# Internal library for now. release-plz / cargo-dist should not see it
# until follow-up slices are ready to ship a stable public API.
publish = false

[package.metadata.dist]
dist = false

[lib]
name = "ato_net"
path = "src/lib.rs"

[features]
default = []
# Enable DNS-over-HTTPS support in DohResolver (requires TLS stack).
# Not enabled by default — DohResolver struct always exists but DoH
# protocol is only active with this feature.
doh = ["hickory-resolver/dns-over-https-rustls"]

[dependencies]
# Path resolution for the default control socket location
# (${ATO_HOME}/run/netd.sock). Reusing capsule's resolver keeps
# ATO_HOME semantics consistent across CLI / Desktop / ato-netd.
capsule = { path = "../capsule", version = "0.11.0" }

# Wire protocol over the local control socket: newline-delimited JSON.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async I/O — Client connects to the daemon's UDS and exchanges JSON.
# Feature-minimized: ato-net never needs a full Tokio runtime, only the
# pieces a consumer like ato-cli already has available.
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "time"] }

# Typed errors at the API boundary so consumers can match on
# Error::NotRunning vs Error::DaemonError without string parsing.
thiserror = "1.0"

# URL validation for upstream_url in RegisterIngress control request.
url = "2"

# Async trait support for object-safe Resolver trait (consistent with
# rest of workspace: ato-cli, capsule, nacelle all use async-trait).
async-trait = "0.1"

# DNS resolver — Slice D baseline. Hickory (formerly trust-dns-resolver)
# provides structured CNAME chain, per-record TTL, and typed errors that
# tokio::net::lookup_host cannot expose.
hickory-resolver = "0.24"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "rt-multi-thread", "time", "process"] }
