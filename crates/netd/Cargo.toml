[package]
name = "netd"
version = "0.5.2"
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
description = "ato network broker — session-scoped sidecar that hosts DNS resolution, proxy policy, and ingress / egress for ato sessions. Slice A ships the daemon skeleton; ingress / DNS / egress land in follow-up slices per #294."
repository = "https://github.com/ato-run/ato"
homepage = "https://ato.run"
authors = ["Koh0920"]
keywords = ["network", "dns", "proxy", "ato", "daemon"]
categories = ["network-programming", "command-line-utilities"]
# Internal crate for now — release workflow wiring is explicitly out of
# scope for #296 (slice A). `publish = false` keeps it off crates.io;
# the `[package.metadata.dist] dist = false` below tells cargo-dist not
# to include it in tag-driven release artifacts (otherwise the `plan`
# step demands WiX GUIDs we don't have yet for an MSI we don't ship).
# Drop both flags when slice **G** — or a dedicated release-wiring PR —
# starts shipping `ato-netd` alongside `ato-cli` / `nacelle`.
publish = false

[package.metadata.dist]
dist = false

[lib]
name = "netd"
path = "src/lib.rs"

[[bin]]
name = "ato-netd"
path = "src/main.rs"

[features]
default = []
# Enable DNS-over-HTTPS support in the DohResolver backend (requires a TLS
# stack). Without it the struct exists but `DohResolver::new` returns
# `BackendUnavailable`.
doh = ["hickory-resolver/dns-over-https-rustls"]

[dependencies]
# Shared wire types (control envelopes, resolver / receipt DTOs,
# stable-origin derivation) live in protocol; depending on it keeps
# client/server in lockstep on the wire protocol (Request / Response enums)
# without pulling capsule or a separate network crate into the daemon.
protocol = { path = "../protocol" }

# Async trait support for the object-safe Resolver trait.
async-trait = "0.1"
# DNS resolver backends — Hickory provides structured CNAME chains,
# per-record TTL, and typed errors that tokio::net::lookup_host cannot.
hickory-resolver = "0.24"

clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Ingress reverse proxy (slice B, #297)
# hyper v1 for HTTP/1.1 streaming proxy + WebSocket upgrade tunneling.
hyper = { version = "1", features = ["full"] }
# hyper-util: TokioIo adapter and higher-level utilities.
hyper-util = { version = "0.1", features = ["full"] }
# http-body-util: BodyExt trait, BoxBody, Empty, Full for response bodies.
http-body-util = "0.1"
# http: Request/Response/HeaderMap types used directly in ingress/hop_by_hop.
http = "1"
# tokio-tungstenite: WebSocket upgrade relay via tokio::io::copy_bidirectional.
tokio-tungstenite = "0.28"
# url: Url parsing for upstream_url in RegisterIngress.
url = "2"
# bytes: Bytes type used in BoxBody.
bytes = "1"
# socket2: SO_REUSEADDR on ingress listener binds (avoids TIME_WAIT port conflicts on restart).
socket2 = { version = "0.5", features = ["all"] }

# Egress CONNECT proxy (slice E, #300)
# ipnet: IpNet type for CIDR policy matching. Must be a direct dependency
# (transitive does not work for trait bounds on the egress policy engine).
ipnet = "2"

# Runtime identity (slice B, #382): generate cryptographically random
# runtime_id and control_token on first start.
rand = "0.8"
hex = "0.4"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1", features = ["full"] }
# For test HTTP clients in ingress acceptance tests.
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1"
tokio-tungstenite = "0.28"
bytes = "1"
futures-util = "0.3"
serial_test = "3"
# async-trait: needed by fake Resolver impls in egress unit tests.
async-trait = "0.1"
