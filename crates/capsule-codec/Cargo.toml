[package]
name = "capsule-codec"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MPL-2.0"
description = "Portable deterministic CBOR encoding for Capsule Protocol"
homepage = "https://ato.run"
repository = "https://github.com/ato-run/ato"

[package.metadata.dist]
dist = false

[dependencies]
capsule-protocol = { path = "../capsule-protocol", version = "0.1.0" }
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2.0"

[dev-dependencies]
hex = "0.4"
