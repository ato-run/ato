# cargo-dist configuration for the `ato-run/ato` monorepo.
#
# **Scope**: CLI-only. The Desktop is released from `ato-run/ato-desktop`.
#
# The `packages = ["ato-cli"]` line is the load-bearing scope filter:
# without it, cargo-dist would pick up every workspace member and try
# to publish artifacts for them.
# Only the `ato-cli` binary feeds the Homebrew Formula and CLI MSI installer.
#
# `v*` tags trigger cargo-dist's release.yml.

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# Restrict cargo-dist to the Capsule lifecycle CLI. Physical adapters and
# materializers are linked into that product assembly; no Provider binary is
# part of the default lifecycle.
packages = ["ato-cli"]
# Build only the required packages, and individually
precise-builds = true
# The installers to generate for each app
installers = ["homebrew", "msi", "shell"]
# A GitHub repo to push Homebrew formulas to
tap = "ato-run/homebrew-ato"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"

[dist.github-custom-runners]
# GitHub retired the macos-14 image dist defaults to for this target.
aarch64-apple-darwin = "macos-15"
