[package]
name = "ato-connected-realization-worker"
version = "0.1.0"
edition = "2024"
description = "Connected Runtime Worker for portable Capsule realizations"
license = "Apache-2.0 OR MPL-2.0"
repository = "https://github.com/ato-run/ato"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "app"

[[bin]]
name = "ato-connected-realization-worker"
path = "src/bin/ato-connected-realization-worker.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
ato-adapter-api = { path = "../../extensions/adapters/api", version = "0.1.0" }
ato-adapter-browser = { path = "../../extensions/adapters/browser", version = "0.1.0" }
ato-browser-host = { path = "../../extensions/browser-host", version = "0.1.0" }
ato-browser-semantics = { path = "../../extensions/semantics/browser", version = "0.1.0" }
ato-computation = { path = "../../lib/computation", version = "0.1.0" }
ato-compose = { path = "../../lib/compose", version = "0.1.0" }
ato-contracts = { path = "../../extensions/contracts", version = "0.1.0" }
ato-kernel = { path = "../../lib/kernel", version = "0.1.0" }
ato-materializer-api = { path = "../../extensions/materializers/api", version = "0.1.0" }
ato-materializer-vm-snapshot = { path = "../../extensions/materializers/vm-snapshot", version = "0.1.0" }
ato-objects = { path = "../../lib/objects", version = "0.1.0" }
ato-planner = { package = "ato-realization-planner", path = "../../extensions/planner", version = "0.1.0" }
ato-record-writer = { path = "../../extensions/record-writer", version = "0.1.0" }
ato-runtime-object-graph = { path = "../runtime-object-graph", version = "0.1.0" }
clap = { version = "4.5", features = ["derive", "env"] }
hmac = "0.12"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2"
tungstenite = "0.28"
