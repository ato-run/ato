[package]
name = "ato-portable-application"
version = "0.1.0"
edition = "2024"
description = "Shared validator and local realization for portable application capsule bundles"
license = "Apache-2.0 OR MPL-2.0"
repository = "https://github.com/ato-run/ato"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "app"

[[bin]]
name = "ato-portable-validator"
path = "src/bin/ato-portable-validator.rs"

[dependencies]
ato-computation = { path = "../../lib/computation", version = "0.1.0" }
ato-formation = { path = "../../lib/formation", version = "0.1.0" }
ato-materializer-static-web = { path = "../../extensions/materializers/static-web", version = "0.1.0" }
ato-objects = { path = "../../lib/objects", version = "0.1.0" }
base64 = "0.22"
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
