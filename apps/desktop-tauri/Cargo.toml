# Ato Desktop — Tauri shell (migration from the GPUI + Wry reference shell).
# Kept out of the parent workspace because Tauri's platform graph and release
# lifecycle are independent, exactly like apps/desktop.
[workspace]

[package]
name = "ato-desktop-tauri"
version = "0.1.0"
edition = "2024"
description = "Ato Desktop — minimal Tauri shell that delegates Capsule operations to the ato CLI"
publish = false
build = "build.rs"

[package.metadata.ato-architecture]
layer = "app"

[lib]
name = "ato_desktop_tauri_lib"
# This package is desktop-only. Mobile-oriented staticlib/cdylib outputs make
# the MinGW linker export the entire Tauri graph and can exceed PE ordinals.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ato-host-control = { path = "../../lib/host-control" }
ato-ipc = { path = "../../lib/ipc" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
