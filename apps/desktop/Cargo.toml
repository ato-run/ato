[workspace]

[package]
name = "ato-desktop"
version = "0.7.9"
edition = "2024"
authors = ["ato-run"]
description = "Desktop launcher for Ato computations"
license = "Apache-2.0 OR MPL-2.0"
publish = false
build = "build.rs"

[package.metadata.dist]
dist = false

[package.metadata.ato-architecture]
layer = "app"

[lib]
name = "ato_desktop"
path = "src/lib.rs"

[[bin]]
name = "ato-desktop"
path = "src/main.rs"

[[bin]]
name = "ato-desktop-mcp"
path = "src/bin/ato_desktop_mcp.rs"

[dependencies]
anyhow = "1"
ato-ipc = { path = "../../lib/ipc" }
serde_json = "1"
