# Transformation v0 fixture B.
#
# A different implementation of the same behavioral Contract: the manifest is
# the same shape and pins the same response body digest, while app.py takes a
# different stdlib path (socketserver + raw request parsing). The source is a
# different tree, so the DerivationRef moves; the ContractRef does not.
schema = "ato.capsule/2"

[application]
title = "Transformation v0 fixture B"
surface_path = "/"

[[input]]
id = "workspace"
use = "ato.workspace@1"
path = "."

[contract]
mode = "all"

[[contract.observation]]
id = "root"
use = "ato.contract.http@1"
port = "app.http"
method = "GET"
path = "/"
status = 200
body_digest = "sha256:f345de2490fa7c64f7398b35c26b4591dfa662d3e7815c3a73e591f48559452d"

[[derivation]]
id = "app"
use = "ato.process@1"
argv = ["python3", "app.py"]
cwd = "."
guest_port = 8000
runtimes = { python = "3.12" }

[effects]
default = "pure"
