# Transformation v0 fixture A.
#
# One workspace input, one behavioral HTTP observation and one Python process
# route. The Contract deliberately does NOT capture the workspace closure
# (`ato.contract.workspace@1`), so the same K can be preserved for a different
# source. The response body is pinned by digest, so a candidate that returns
# different bytes fails the existing verifier.
schema = "ato.capsule/2"

[application]
title = "Transformation v0 fixture A"
surface_path = "/"

[[input]]
id = "workspace"
use = "ato.workspace@1"
path = "."

[contract]
mode = "all"

[[contract.observation]]
id = "root"
use = "ato.contract.http@1"
port = "app.http"
method = "GET"
path = "/"
status = 200
body_digest = "sha256:f345de2490fa7c64f7398b35c26b4591dfa662d3e7815c3a73e591f48559452d"

[[derivation]]
id = "app"
use = "ato.process@1"
argv = ["python3", "app.py"]
cwd = "."
guest_port = 8000
runtimes = { python = "3.12" }

[effects]
default = "pure"
