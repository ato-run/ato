[package]
name = "ato-cli"
version = "0.7.9"
edition = "2024"
description = "Ato command line interface for addressable computations"
authors = ["ato-run"]
homepage = "https://ato.run"
license = "Apache-2.0 OR MPL-2.0"
repository = "https://github.com/ato-run/ato"
build = "build.rs"

[package.metadata.ato-architecture]
layer = "app"

[package.metadata.wix]
upgrade-guid = "91E1EDBC-3923-4EB3-8AD9-02239A1537BA"
path-guid = "6DBB2927-20CD-429F-BAD0-687E62082ED6"
license = false
eula = false

[[bin]]
name = "ato"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ato-adapter-api = { path = "../../extensions/adapters/api", version = "0.1.0" }
ato-adapter-binding = { path = "../../extensions/adapters/binding", version = "0.1.0" }
ato-adapter-browser = { path = "../../extensions/adapters/browser", version = "0.1.0" }
ato-adapter-http = { path = "../../extensions/adapters/http", version = "0.1.0" }
ato-adapter-process = { path = "../../extensions/adapters/process", version = "0.1.0" }
ato-adapter-pty = { path = "../../extensions/adapters/pty", version = "0.1.0" }
ato-adapter-workspace = { path = "../../extensions/adapters/workspace", version = "0.1.0" }
ato-computation = { path = "../../lib/computation", version = "0.1.0" }
ato-ipc = { path = "../../lib/ipc", version = "0.1.0" }
ato-kernel = { path = "../../lib/kernel", version = "0.1.0" }
ato-objects = { path = "../../lib/objects", version = "0.1.0" }
ato-runtime = { path = "../../lib/runtime", version = "0.1.0" }
ato-materializer-snapshot = { path = "../../extensions/materializers/snapshot", version = "0.1.0" }
ato-materializer-api = { path = "../../extensions/materializers/api", version = "0.1.0" }
ato-materializer-replay = { path = "../../extensions/materializers/replay", version = "0.1.0" }
ato-compose = { path = "../../lib/compose", version = "0.1.0" }
netd = { path = "../../services/netd", version = "0.5.2" }
base64 = "0.22"
blake3 = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
tempfile = "3"
toml = "0.8"
tungstenite = "0.28"
time = { version = "0.3", features = ["formatting"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
