[package]
name = "ato-cli"
version = "1.0.0"
edition = "2024"
description = "Ato command line interface for addressable computations"
authors = ["ato-run"]
homepage = "https://ato.run"
license = "MPL-2.0"
repository = "https://github.com/ato-run/ato"
build = "build.rs"

[package.metadata.ato-architecture]
layer = "app"

[package.metadata.wix]
upgrade-guid = "60A5FB2E-48AA-44A9-9FE9-EFC28BEC2F83"
path-guid = "6DBB2927-20CD-429F-BAD0-687E62082ED6"
license = false
eula = false

[[bin]]
name = "ato"
path = "src/main.rs"

[[bin]]
name = "ato-object-graph-upload"
path = "src/bin/ato-object-graph-upload.rs"

[[bin]]
name = "ato-activity-mcp"
path = "src/bin/ato-activity-mcp.rs"

[[bin]]
name = "ato-formation-session-mcp"
path = "src/bin/ato-formation-session-mcp.rs"

[dependencies]
anyhow = "1"
ato-adapter-api = { path = "../../extensions/adapters/api", version = "1.0.0" }
ato-adapter-binding = { path = "../../extensions/adapters/binding", version = "1.0.0" }
ato-adapter-browser = { path = "../../extensions/adapters/browser", version = "1.0.0" }
ato-adapter-http = { path = "../../extensions/adapters/http", version = "1.0.0" }
ato-adapter-oci = { path = "../../extensions/adapters/oci", version = "1.0.0" }
ato-adapter-process = { path = "../../extensions/adapters/process", version = "1.0.0" }
ato-host-facts = { path = "../../lib/ato-host-facts", version = "1.0.0" }
ato-adapter-pty = { path = "../../extensions/adapters/pty", version = "1.0.0" }
ato-adapter-workspace = { path = "../../extensions/adapters/workspace", version = "1.0.0" }
ato-browser-semantics = { path = "../../extensions/semantics/browser", version = "1.0.0" }
ato-computation = { path = "../../lib/computation", version = "1.0.0" }
ato-coordinator = { path = "../../services/coordinator", version = "1.0.0" }
ato-formation = { path = "../../lib/formation", version = "1.0.0" }
ato-ipc = { path = "../../lib/ipc", version = "1.0.0" }
ato-kernel = { path = "../../lib/kernel", version = "1.0.0" }
ato-local-execution = { path = "../../lib/local-execution", version = "1.0.0" }
ato-objects = { path = "../../lib/objects", version = "1.0.0" }
ato-record-writer = { path = "../../extensions/record-writer", version = "1.0.0" }
ato-runtime-object-graph = { path = "../runtime-object-graph", version = "1.0.0" }
ato-sandbox = { path = "../../lib/sandbox", version = "1.0.0" }
ato-portable-application = { path = "../portable-application", version = "1.0.0" }
ato-runtime-attempt = { path = "../../lib/runtime-attempt", version = "1.0.0" }
ato-materializer-snapshot = { path = "../../extensions/materializers/snapshot", version = "1.0.0" }
ato-materializer-api = { path = "../../extensions/materializers/api", version = "1.0.0" }
ato-materializer-replay = { path = "../../extensions/materializers/replay", version = "1.0.0" }
ato-materializer-vm-snapshot = { path = "../../extensions/materializers/vm-snapshot", version = "1.0.0" }
ato-player = { path = "../../extensions/player", version = "1.0.0" }
ato-realization-planner = { path = "../../extensions/planner", version = "1.0.0" }
ato-compose = { path = "../../lib/compose", version = "1.0.0" }
ato-contracts = { path = "../../extensions/contracts", version = "1.0.0" }
ato-formation-worker = { path = "../formation-worker", version = "1.0.0" }
base64 = "0.22"
blake3 = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
getrandom = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
signal-hook = "0.3"
socket2 = "=0.6.4"
tempfile = "3"
toml = "0.8"
serde_yaml_ng = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
assert_cmd = "2"
# The real coordinator library (same code the `ato-capsulehub` binary runs) is
# exercised in-process by tests/hub_e2e.rs. Test-only: it must never become a
# CLI dependency.
capsulehub = { path = "../../services/capsulehub" }
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
