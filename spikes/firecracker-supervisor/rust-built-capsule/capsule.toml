# v1.2 supervisor capsule: declares a delivery=env secret, so the Rust rootfs_builder
# (derive_supervisor_build_spec) emits an agent-as-init rootfs + /etc/ato/supervisor.json.
schema_version = "0.3"
name = "compat-supervisor-openai"
version = "0.1.0"
type = "app"
default_target = "app"

[targets.app]
runtime = "source"
run = "python3 app.py"
port = 8080
readiness_probe = { http_get = "/health" }

[secrets.OPENAI_API_KEY]
required = true
env = "OPENAI_API_KEY"
