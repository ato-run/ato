# v1.2 supervisor capsule: declares a delivery=env secret, so the Rust rootfs_builder
# (derive_supervisor_build_spec) emits an agent-as-init rootfs + /etc/ato/supervisor.json.
schema_version = "0.3"
name = "compat-supervisor-openai"
version = "0.1.0"
type = "app"
default_target = "app"

[targets.app]
runtime = "source"
run = "python3 app.py"
port = 8080
readiness_probe = { http_get = "/health" }

# The secret KEY is the binding name (lowercase-only BindingName: [a-z0-9_.-]); the
# UPPERCASE process env var is set explicitly via `env`. Using an uppercase key here
# would emit a supervisor.json the guest-agent refuses (exit 2 before the vsock listener).
[secrets.openai_api_key]
required = true
env = "OPENAI_API_KEY"
